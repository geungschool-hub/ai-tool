<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="업무판">
<meta name="theme-color" content="#ffffff">
<title>학교업무</title>
<style>
/* ── 노션 토큰 ─────────────────────────────────────────────────────────
   글자는 따뜻한 먹빛 #37352F 이고 순검정은 쓰지 않는다. 선은 거의 안 보이는 굵기.
   폰은 16px 이상으로 두고, 노션의 촘촘한 밀도(14/12px)는 PC 분기에서만 쓴다. */
:root{
  --bg:#fff; --ink:#37352F;
  --ink-60:rgba(55,53,47,.65); --ink-45:rgba(55,53,47,.45); --ink-30:rgba(55,53,47,.3);
  --line:rgba(55,53,47,.09); --line-2:rgba(55,53,47,.16);
  --hover:rgba(55,53,47,.06); --press:rgba(55,53,47,.12);
  --blue:#2383E2;
  --shadow:0 1px 2px rgba(15,15,15,.1);
  --sheet-shadow:rgba(15,15,15,.05) 0 0 0 1px,rgba(15,15,15,.1) 0 3px 6px,rgba(15,15,15,.2) 0 9px 24px;

  /* 태그 — 노션 라이트 팔레트 */
  --t-gray-b:#E3E2E0;   --t-gray-f:#32302C;
  --t-brown-b:#EEE0DA;  --t-brown-f:#442A1E;
  --t-orange-b:#FADEC9; --t-orange-f:#49290E;
  --t-yellow-b:#FDECC8; --t-yellow-f:#402C1B;
  --t-green-b:#DBEDDB;  --t-green-f:#1C3829;
  --t-blue-b:#D3E5EF;   --t-blue-f:#183347;
  --t-purple-b:#E8DEEE; --t-purple-f:#412454;
  --t-pink-b:#F5E0E9;   --t-pink-f:#4C2337;
  --t-red-b:#FFE2DD;    --t-red-f:#5D1715;

  /* 영역 — 노션에서 쓰시던 색 */
  --admin:#D9730D; --event:#E03E3E; --class:#0B6E99;
  /* 상태 점 */
  --todo:#91918E; --doing:#337EA9; --done:#448361; --dropped:#9B9A97;

  --nav-h:56px; --row-h:48px;
}

/* ── 어두울 때 — 노션의 밤 색. 값만 갈아 끼운다(구조는 그대로) ───────────
   시스템 설정을 따르되 [data-theme] 이 있으면 그쪽이 이긴다. */
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#191919; --ink:rgba(255,255,255,.81);
  --ink-60:rgba(255,255,255,.56); --ink-45:rgba(255,255,255,.44); --ink-30:rgba(255,255,255,.28);
  --line:rgba(255,255,255,.094); --line-2:rgba(255,255,255,.18);
  --hover:rgba(255,255,255,.055); --press:rgba(255,255,255,.1);
  --blue:#2E9AF5; --shadow:0 1px 2px rgba(0,0,0,.4);
  --sheet-shadow:rgba(255,255,255,.06) 0 0 0 1px,rgba(0,0,0,.4) 0 3px 6px,rgba(0,0,0,.5) 0 9px 24px;
  --t-gray-b:#5A5A5A;   --t-gray-f:rgba(255,255,255,.88);
  --t-brown-b:#603B2C;  --t-brown-f:rgba(255,255,255,.88);
  --t-orange-b:#854C1D; --t-orange-f:rgba(255,255,255,.88);
  --t-yellow-b:#89632A; --t-yellow-f:rgba(255,255,255,.88);
  --t-green-b:#2B593F;  --t-green-f:rgba(255,255,255,.88);
  --t-blue-b:#28456C;   --t-blue-f:rgba(255,255,255,.88);
  --t-purple-b:#492F64; --t-purple-f:rgba(255,255,255,.88);
  --t-pink-b:#69314C;   --t-pink-f:rgba(255,255,255,.88);
  --t-red-b:#6E3630;    --t-red-f:rgba(255,255,255,.88);
  --admin:#C77D48; --event:#DF5452; --class:#5E97C0;
  --todo:#979797; --doing:#5E97C0; --done:#6E9B78; --dropped:#787774;
} }
:root[data-theme="dark"]{
  --bg:#191919; --ink:rgba(255,255,255,.81);
  --ink-60:rgba(255,255,255,.56); --ink-45:rgba(255,255,255,.44); --ink-30:rgba(255,255,255,.28);
  --line:rgba(255,255,255,.094); --line-2:rgba(255,255,255,.18);
  --hover:rgba(255,255,255,.055); --press:rgba(255,255,255,.1);
  --blue:#2E9AF5; --shadow:0 1px 2px rgba(0,0,0,.4);
  --sheet-shadow:rgba(255,255,255,.06) 0 0 0 1px,rgba(0,0,0,.4) 0 3px 6px,rgba(0,0,0,.5) 0 9px 24px;
  --t-gray-b:#5A5A5A;   --t-gray-f:rgba(255,255,255,.88);
  --t-brown-b:#603B2C;  --t-brown-f:rgba(255,255,255,.88);
  --t-orange-b:#854C1D; --t-orange-f:rgba(255,255,255,.88);
  --t-yellow-b:#89632A; --t-yellow-f:rgba(255,255,255,.88);
  --t-green-b:#2B593F;  --t-green-f:rgba(255,255,255,.88);
  --t-blue-b:#28456C;   --t-blue-f:rgba(255,255,255,.88);
  --t-purple-b:#492F64; --t-purple-f:rgba(255,255,255,.88);
  --t-pink-b:#69314C;   --t-pink-f:rgba(255,255,255,.88);
  --t-red-b:#6E3630;    --t-red-f:rgba(255,255,255,.88);
  --admin:#C77D48; --event:#DF5452; --class:#5E97C0;
  --todo:#979797; --doing:#5E97C0; --done:#6E9B78; --dropped:#787774;
}
*{box-sizing:border-box}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",Helvetica,"Apple Color Emoji","Segoe UI Emoji",sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;height:100dvh;overflow:hidden;overflow-x:hidden;
}
button,.tap{min-height:44px;min-width:44px;font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer;border-radius:4px}
button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
input,textarea,select{font-family:inherit;font-size:16px;color:inherit;border:0;background:none}
ul,ol{margin:0;padding:0;list-style:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ── 머리 ───────────────────────────────────────────────────────────── */
#scroll{order:2;flex:1;overflow:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column}
header{padding:12px 16px 0;flex:none}
.pageicon{font-size:32px;line-height:1;margin-bottom:2px}
h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.sub{color:var(--ink-45);font-size:16px;margin-top:2px}

/* 보기 탭 — 노션은 밑줄 2px 하나로 지금 보기를 알린다 */
.views{display:flex;gap:2px;align-items:center;margin-top:12px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;
  position:sticky;top:0;z-index:5;background:var(--bg);flex:none}
.views::-webkit-scrollbar{display:none}
.views button{padding:0 8px;height:44px;min-width:0;color:var(--ink-60);white-space:nowrap;border-radius:4px 4px 0 0;position:relative}
.views button:hover{background:var(--hover)}
.views button.on{color:var(--ink);font-weight:500}
.views button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink)}
.views .grow{flex:1;min-width:8px}
.views .gear{color:var(--ink-45)}

/* ── 입력줄 ─────────────────────────────────────────────────────────── */
#inbar{order:1;flex:none;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 12px}
#preview{display:flex;gap:4px;flex-wrap:wrap;min-height:0;margin-bottom:6px}
#preview:empty{display:none;margin:0}
.inrow{display:flex;gap:8px;align-items:center}
#in{flex:1;height:44px;padding:0 12px;background:var(--hover);border-radius:6px;min-width:0}
#in::placeholder{color:var(--ink-30)}
#go{width:44px;height:44px;background:var(--blue);color:#fff;border-radius:6px;font-weight:600;flex:none}
#pick{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.chips-wrap{position:relative;margin-top:6px}
.chips-wrap.more::after{content:"";position:absolute;right:0;top:0;bottom:0;width:28px;pointer-events:none;background:linear-gradient(90deg,transparent,var(--bg))}
.chips{display:flex;gap:4px;align-items:center;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
#inbar .chip{min-width:44px;height:44px;padding:0 10px;color:var(--ink-60);white-space:nowrap;flex:none;border-radius:4px}
#inbar .chip:hover{background:var(--hover)}
#inbar .chip.a-admin{color:var(--admin)}
#inbar .chip.a-event{color:var(--event)}
#inbar .chip.a-class{color:var(--class)}
#inbar .sep{flex:none;width:1px;height:20px;margin:0 4px;background:var(--line-2)}

/* ── 태그 칩 ────────────────────────────────────────────────────────── */
.tg{display:inline-flex;align-items:center;max-width:100%;height:24px;padding:0 8px;border-radius:4px;
    background:var(--t-gray-b);color:var(--t-gray-f);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg.gray{background:var(--t-gray-b);color:var(--t-gray-f)}
.tg.brown{background:var(--t-brown-b);color:var(--t-brown-f)}
.tg.orange{background:var(--t-orange-b);color:var(--t-orange-f)}
.tg.yellow{background:var(--t-yellow-b);color:var(--t-yellow-f)}
.tg.green{background:var(--t-green-b);color:var(--t-green-f)}
.tg.blue{background:var(--t-blue-b);color:var(--t-blue-f)}
.tg.purple{background:var(--t-purple-b);color:var(--t-purple-f)}
.tg.pink{background:var(--t-pink-b);color:var(--t-pink-f)}
.tg.red{background:var(--t-red-b);color:var(--t-red-f)}
.dot{display:inline-flex;align-items:center;justify-content:center;flex:none}
.dot i{width:10px;height:10px;border-radius:50%;background:var(--todo);font-style:normal;display:block}
.dot.off{cursor:default}
.s-todo i{background:var(--todo)}
.s-doing i{background:var(--doing)}
.s-done i{background:var(--done)}
.s-dropped i{background:var(--dropped)}
.stat{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:4px;background:var(--t-gray-b);color:var(--t-gray-f);white-space:nowrap}
.stat.s-doing{background:var(--t-blue-b);color:var(--t-blue-f)}
.stat.s-done{background:var(--t-green-b);color:var(--t-green-f)}
.stat.s-dropped{background:var(--t-gray-b);color:var(--ink-45)}

/* ── 본문 ───────────────────────────────────────────────────────────── */
main{flex:1 0 auto;padding:0 8px 24px}
.gh{display:flex;align-items:center;gap:6px;padding:0 8px;height:44px;position:sticky;top:44px;background:var(--bg);z-index:2}
.gh .fold{width:44px;height:44px;color:var(--ink-45);display:flex;align-items:center;justify-content:center}
.gh .fold b{font-style:normal;font-weight:400;display:block;transition:transform .12s ease}
.gh.closed .fold b{transform:rotate(-90deg)}
.gh b{color:var(--ink-45);font-weight:400;margin-left:6px}
.gh .add{margin-left:auto;color:var(--ink-45);width:44px;height:44px}
.gh .add:hover{background:var(--hover)}

/* 행 — 폰에서는 두 줄짜리 목록, PC 에서는 표의 한 줄 */
.row{display:flex;align-items:center;gap:8px;min-height:48px;padding:6px 8px;border-bottom:1px solid var(--line);
     border-left:3px solid transparent;cursor:pointer}
.row:hover{background:var(--hover)}
.row.a-admin{border-left-color:var(--admin)}
.row.a-event{border-left-color:var(--event)}
.row.a-class{border-left-color:var(--class)}
.row.stale .main{opacity:.55}
.row .dot{width:28px;height:44px;margin-left:-6px}
.row .emo{flex:none;width:22px;text-align:center}
.row .main{flex:1;min-width:0}
.row .ttl{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.s-done .ttl,.row.s-dropped .ttl{color:var(--ink-45);text-decoration:line-through}
.row .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:3px;color:var(--ink-45)}
.row .dn{color:var(--ink-45)}
.row .dn.over{color:var(--event);font-weight:500}
.row .dn.now{color:var(--admin);font-weight:500}
.row .id{color:var(--ink-30);font-variant-numeric:tabular-nums}
.empty{padding:32px 12px;color:var(--ink-30);text-align:center}

/* 표 머리 — PC 에서만 보인다 */
.thead{display:none}

/* ── 보드 ───────────────────────────────────────────────────────────── */
.board{display:flex;gap:12px;overflow-x:auto;padding:8px 4px 8px;align-items:flex-start}
.bcol{flex:none;width:78vw;max-width:300px;display:flex;flex-direction:column;gap:8px}
.bhead{display:flex;align-items:center;gap:6px;padding:0 4px;height:44px}
.bhead .cnt{color:var(--ink-45)}
.card{background:var(--bg);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);padding:10px;cursor:pointer}
.card:hover{background:var(--hover)}
.card .ttl{display:flex;gap:6px;align-items:baseline}
.card .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
.card.stale{opacity:.6}
.badd{color:var(--ink-45);text-align:left;padding:0 8px;height:44px;border-radius:6px}
.badd:hover{background:var(--hover)}

/* ── 캘린더 ─────────────────────────────────────────────────────────── */
.cal{padding:8px 0}
.calbar{display:flex;align-items:center;gap:4px;padding:0 4px 8px}
.calbar .mon{font-weight:600;margin-right:auto}
.calbar button{width:44px;height:44px;color:var(--ink-60)}
.calbar button:hover{background:var(--hover)}
.calbar .today{width:auto;padding:0 12px;color:var(--ink-60)}
.dow{display:grid;grid-template-columns:repeat(7,1fr);color:var(--ink-45);border-bottom:1px solid var(--line)}
.dow span{padding:6px 8px;text-align:right}
.dow span:first-child{color:var(--event)}
.dow span:last-child{color:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.day{min-height:96px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;overflow:hidden}
.day:nth-child(7n){border-right:0}
.day.out{background:var(--hover);opacity:.6}
.day .num{color:var(--ink-45);text-align:right;padding:0 2px}
.day.is-today .num{display:inline-block;float:right;background:var(--event);color:#fff;border-radius:50%;width:24px;height:24px;text-align:center;line-height:24px;padding:0}
.day .ev{display:block;width:100%;text-align:left;min-height:0;padding:2px 4px;border-radius:4px;margin-top:2px;
         overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--t-gray-b);color:var(--t-gray-f)}
.day .ev.a-admin{background:var(--t-orange-b);color:var(--t-orange-f)}
.day .ev.a-event{background:var(--t-red-b);color:var(--t-red-f)}
.day .ev.a-class{background:var(--t-blue-b);color:var(--t-blue-f)}
.day .ev.s-done{opacity:.5;text-decoration:line-through}
.day .more{color:var(--ink-45);padding:0 4px;min-height:0}

/* ── 아래 탭 ────────────────────────────────────────────────────────── */
nav{order:3;flex:none;display:flex;border-top:1px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;height:var(--nav-h);color:var(--ink-45);border-radius:0}
nav button.on{color:var(--ink);font-weight:500;box-shadow:inset 0 2px 0 var(--ink)}

/* ── 시트 · 모달 ────────────────────────────────────────────────────── */
.sheet,.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(15,15,15,.3)}
.modal{align-items:center;padding:16px}
.sheet-bg{position:absolute;inset:0}
.sheet-body,.modal-body{position:relative;width:100%;max-width:560px;max-height:88dvh;overflow:auto;background:var(--bg);
  border-radius:10px 10px 0 0;box-shadow:var(--sheet-shadow);padding:8px 16px calc(16px + env(safe-area-inset-bottom))}
.modal-body{border-radius:10px;max-width:420px;padding:8px 16px 16px}
.sh-top{display:flex;align-items:center;gap:8px;position:sticky;top:0;background:var(--bg);padding-top:8px;z-index:1}
.sh-top .emo{width:44px;height:44px;font-size:22px}
.sh-top #sh-title{flex:1;min-width:0;font-size:20px;font-weight:600;padding:4px 0}
.sh-top .x{width:44px;height:44px;color:var(--ink-45);flex:none}
h2{margin:0;font-size:20px;font-weight:600;display:flex;align-items:center;gap:8px;padding:8px 0}
h2 button{margin-left:auto;width:44px;height:44px;color:var(--ink-45)}
.lbl{color:var(--ink-45);padding:14px 0 4px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{min-height:44px;padding:0 12px;border-radius:4px;background:var(--hover);color:var(--ink-60)}
.seg button.on{background:var(--ink);color:#fff}
.duerow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.duerow input{height:44px;padding:0 10px;background:var(--hover);border-radius:4px}
.push{display:flex;gap:4px;flex-wrap:wrap}
.push button{min-height:44px;padding:0 10px;color:var(--ink-60);border-radius:4px;background:var(--hover)}
.ck{display:flex;align-items:center;gap:8px;padding:2px 0}
.ck .tg{flex:none}
.ck span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ck.done span{color:var(--ink-45);text-decoration:line-through}
.ck .rm{width:44px;height:44px;color:var(--ink-30);flex:none}
.ckadd{width:100%;height:44px;padding:0 10px;background:var(--hover);border-radius:4px;margin-top:4px}
#sh-memo{width:100%;min-height:72px;padding:8px 10px;background:var(--hover);border-radius:4px;resize:vertical;line-height:1.6}
.ref{color:var(--ink-45);word-break:break-all}
.log{color:var(--ink-45)}
.log li{display:flex;gap:8px;padding:2px 0}
.log li span:first-child{flex:none;color:var(--ink-30);font-variant-numeric:tabular-nums}
details summary{min-height:44px;display:flex;align-items:center;color:var(--ink-45);cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
.danger{display:flex;gap:8px;margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.danger button{flex:1;min-height:44px;color:var(--event);border-radius:4px;background:var(--hover)}
.danger button{font-weight:500}
.stack{display:flex;flex-direction:column}
.wide{width:100%;min-height:44px;background:var(--hover);border-radius:4px;margin-top:8px;text-align:center}
.acct{color:var(--ink-45)}
.exam{display:flex;gap:8px;align-items:center}
.exam input{flex:1;min-width:0;height:44px;padding:0 10px;background:var(--hover);border-radius:4px}
.stamp{color:var(--ink-30);padding-top:16px;text-align:center}

/* 이모지 고르기 */
.emogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:2px;max-height:46dvh;overflow:auto;margin-top:8px}
.emogrid button{height:44px;font-size:22px;border-radius:4px}
.emogrid button:hover{background:var(--hover)}

/* 검토 */
#review{flex:1 0 auto;padding:24px 16px}
@media (min-width:768px){#review{width:100%;max-width:1120px;margin:0 auto;padding:32px 24px}}
#reqbtn{min-height:44px;padding:0 16px;border-radius:4px;background:var(--hover);color:var(--ink-60)}
#reqbtn.on{background:var(--t-blue-b);color:var(--t-blue-f)}

/* 로그인 */
#login{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#login form{width:100%;max-width:320px;display:flex;flex-direction:column;gap:8px}
#login .pageicon{margin-bottom:0}
#login input{height:48px;padding:0 12px;background:var(--hover);border-radius:6px}
#login button{height:48px;border-radius:6px;background:var(--blue);color:#fff;font-weight:600;margin-top:8px}
#login .msg{min-height:24px;color:var(--event)}

/* 연결 배지 · 토스트 */
#conn{padding:2px 8px;border-radius:4px;background:var(--t-yellow-b);color:var(--t-yellow-f);white-space:nowrap;margin-left:8px}
#conn.ok{display:none}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:70;background:var(--ink);color:#fff;
  border-radius:6px;padding:0 6px 0 14px;display:flex;align-items:center;gap:8px;box-shadow:var(--sheet-shadow);max-width:calc(100% - 24px)}
#toast span{padding:12px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast button{color:var(--blue);padding:0 10px;min-height:44px}
[hidden]{display:none!important}

/* ── PC — 여기서부터 노션 표의 밀도(14px 행 · 12px 열 머리) ───────────── */
@media (min-width:768px){
  body{font-size:14px}
  #scroll{order:2}
  header{padding:20px 0 0;width:100%;max-width:1120px;margin:0 auto}
  header>*{padding-left:24px;padding-right:24px}
  .views{width:100%;max-width:1120px;margin:10px auto 0;padding:0 24px}
  .pageicon{font-size:38px;margin-bottom:4px}
  h1{font-size:30px}
  .sub{font-size:14px}
  .views button{height:36px;min-height:36px;font-size:14px}
  main{padding:0 0 64px;width:100%;max-width:1120px;margin:0 auto}
  main>*{padding-left:24px;padding-right:24px}
  nav{display:none}
  #inbar{order:1;border-top:0;border-bottom:1px solid var(--line);width:100%;padding:10px calc(50% - 536px)}
  #in{height:36px;min-height:36px}
  #go{width:36px;height:36px;min-height:36px;min-width:36px}
  #inbar .chip{height:32px;min-height:32px;font-size:14px}
  .chips-wrap.more::after{display:none}

  /* 표 */
  .thead,.row{display:grid;grid-template-columns:minmax(260px,2.2fr) 116px 124px 96px 96px minmax(150px,1fr);
              gap:0;align-items:center}
  .thead{display:grid;font-size:12px;color:var(--ink-45);border-bottom:1px solid var(--line);
         position:sticky;top:36px;background:var(--bg);z-index:3;height:34px}
  .thead span{padding:0 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-right:1px solid var(--line)}
  .thead span:last-child{border-right:0}

  .row>*{padding:5px 8px;border-right:1px solid var(--line);min-width:0;height:100%;display:flex;align-items:center;gap:6px}
  .row>*:last-child{border-right:0}
  .row .dot{width:auto;height:auto;margin:0;min-height:0;min-width:0}
  .row .main{gap:6px}

  .row .emo{width:auto}
  .tg,.stat{height:20px;font-size:14px;padding:0 6px}

  </div>
</div>

</div>

  var t = store.load().tasks[id]; if (!t) return 0;
  var n = 0;
  Object.keys(fields).forEach(function(f){
    var from = getAt(t, f), to = fields[f];
    if (from === undefined) from = null;
    if (JSON.stringify(from) === JSON.stringify(to)) return;

  var inp = $('in'), v = inp.value.replace(/\s+$/, '');
  if (tok === '!') { v = /(^|\s)!(?=\s|$)/.test(v) ? v.replace(/(^|\s)!(?=\s|$)/, '') : v + ' !'; }
  else if (tok.charAt(0) === '#') { v = v.replace(/(^|\s)#(행정|행사|행|사|교과|교)(?=\s|$)/g, '') + ' ' + tok; }
  else { v = v.replace(/(^|\s)@(오늘|내일|모레|이번주|다음주|담주[월화수목금토일]|[월화수목금토일]|없음|\+\d+|[\d\/.\-]+)(?=\s|$)/g, '') + ' ' + tok; }
  inp.value = v.replace(/^\s+/, '') + ' ';
  render(); inp.focus();
}
function chipFade(){ var w = $('tokwrap'), c = $('tokchips'); w.classList.toggle('more', c.scrollLeft + c.clientWidth < c.scrollWidth - 2); }
$('in').addEventListener('input', render);
$('in').addEventListener('keydown', function(e){ if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); submit(); } });
$('go').addEventListener('click', submit);
$('tokchips').addEventListener('click', function(e){
  var b = e.target.closest('[data-tok]'); if (!b) return;
  if (b.dataset.tok === 'pick') { var p = $('pick'); p.value = ''; if (p.showPicker) { try { p.showPicker(); return; } catch (x) {} } p.click(); return; }
  insertToken(b.dataset.tok);
});
$('tokchips').addEventListener('scroll', chipFade);
$('pick').addEventListener('change', function(){ if (this.value) insertToken('@' + this.value); });   // 연도까지 그대로

/* ── 보기 바꾸기 · 본문 누르기 ── */
function goView(v){
  ui.view = v; render();
  if (ui.view !== 'review' && isPC()) $('in').focus();   // 폰에서는 탭만 바꿔도 키보드가 올라오지 않게
}
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-view]'); if (!b) return;
  goView(b.dataset.view);
});
$('reqbtn').addEventListener('click', function(){
  var d = store.load(); store.update({ 'meta/reviewReq': !d.meta.reviewReq }); render();
});
$('main').addEventListener('click', function(e){
  var cal = e.target.closest('[data-cal]');
  if (cal) {
    var cur = ui.cal || todayStr().slice(0, 7);
    if (cal.dataset.cal === 'now') ui.cal = null;
    else {
      var y = +cur.slice(0, 4), mo = +cur.slice(5, 7) + (cal.dataset.cal === 'next' ? 1 : -1);
      if (mo < 1) { mo = 12; y--; } if (mo > 12) { mo = 1; y++; }
      ui.cal = y + '-' + pad2(mo);
    }
    render(); return;
  }
  var area = e.target.closest('[data-area]');
  if (area) { ui.areaFilter = ui.areaFilter === area.dataset.area ? null : area.dataset.area; render(); return; }
  var a = e.target.closest('[data-act]'); if (!a) return;
  var act = a.dataset.act;
  if (act === 'fold') { ui.fold[a.dataset.g] = !ui.fold[a.dataset.g]; render(); return; }
  var holder = a.closest('[data-id]'); if (!holder) return;
  if (act === 'cycle') cycleStatus(holder.dataset.id);
  else if (act === 'open') { ui.open = holder.dataset.id; renderSheet(); }
});

/* ── 상세 시트 ── */
function nextMondayAfter(ymd){ return addDays(ymd, ((1 - dow(ymd) + 7) % 7) || 7); }
function pushDates(today, exam){
  var tmr = addDays(today, 1), fri = nextDow(today, 5), friL = '이번 주 금';
  if (fri <= tmr) { fri = addDays(fri, 7); friL = '다음 주 금'; }   // 목·금엔 「이번 주 금」이 내일·오늘이라 다음 주 금으로
  var p = [['내일', tmr], [friL, fri], ['다음 주 월', nextMonday(today)]];
  if (exam && exam.end) p.push(['시험 뒤', nextMondayAfter(exam.end)]);
  p.sort(function(a, b){ return a[1] < b[1] ? -1 : a[1] > b[1] ? 1 : 0; });
  var seen = {};
  return p.filter(function(x){ if (seen[x[1]]) return false; seen[x[1]] = 1; return true; });   // 같은 날짜는 하나만
}
function logLine(t, l){
  var f = l.field, m = /^checks\/([^/]+)(?:\/(\w+))?$/.exec(f);
  if (m) {
    var c = (t.checks || {})[m[1]], txt = c ? c.text : '';
    if (!m[2]) return (l.to == null ? '− ' : '+ ') + (txt || l.to || l.from || '');
    if (m[2] !== 'done') return null;
    return '☑ ' + (txt || '') + ' ' + (l.to ? '✓' : '○');
  }
  if (f === 'create') return '생성';
  if (f === 'icon') return l.to ? '아이콘 ' + l.to : '아이콘 지움';
  var kv = function(v){ if (v == null) return '—'; if (f === 'status') return STATUS_KO[v] || v;
    if (f === 'area') return AREA_KO[v] || v; if (f === 'priority') return PRI_KO[v] || v;
    if (f === 'due') return dueKo(v); return String(v); };
  return (FIELD_KO[f] || f) + ' ' + kv(l.from) + ' → ' + kv(l.to);
}
function fmtTs(ms){ var d = new Date(ms); return (d.getMonth() + 1) + '/' + d.getDate(); }
function renderSheet(){
  var sh = $('sheet'), d = store.load(), t = d.tasks[ui.open];
  if (!t) { closeSheet(); return; }
  var act = document.activeElement;
  if (act && /^sh-(title|memo|ref)$/.test(act.id || '')) return;   // 적는 중엔 다시 그리지 않는다
  var body = sh.querySelector('.sheet-body'), st = body ? body.scrollTop : 0, opened = !sh.hidden && !!sh.querySelector('details[open]');
  var today = todayStr();
  sh.innerHTML = '<div class="sheet-bg" data-act="close"></div><div class="sheet-body">' +
    '<div class="sh-top"><button class="emo" data-act="emo" aria-label="아이콘">' + (t.icon || '＋') + '</button>' +
      '<input id="sh-title" value="' + esc(t.title) + '">' +
      '<span class="id">' + short(ui.open) + '</span>' +
      '<button class="x" data-act="close" aria-label="닫기">✕</button></div>' +
    '<div class="lbl">상태</div><div class="seg">' + STAT_GROUPS.slice(0, 4).map(function(g){
      return '<button data-set="status" data-v="' + g[0] + '" class="s-' + g[0] + (t.status === g[0] ? ' on' : '') + '">' + g[1] + '</button>'; }).join('') + '</div>' +
    '<div class="lbl">영역</div><div class="seg">' + Object.keys(AREA_KO).map(function(a){
      return '<button data-set="area" data-v="' + a + '" class="a-' + a + (t.area === a ? ' on' : '') + '">' + AREA_KO[a] + '</button>'; }).join('') + '</div>' +
    '<div class="lbl">중요도</div><div class="seg">' + [1, 2, 3].map(function(p){
      return '<button data-set="priority" data-v="' + p + '" class="p-' + p + (t.priority === p ? ' on' : '') + '">' + PRI_KO[p] + '</button>'; }).join('') + '</div>' +
    '<div class="lbl">마감일</div><div class="duerow"><input type="date" id="sh-due" value="' + (t.due || '') + '">' +
      (t.due ? '<span class="dn">' + dLabel(t.due, today) + '</span>' : '') + '</div>' +
      '<div class="push">' + pushDates(today, d.meta.exam).map(function(p){
        return '<button data-set="due" data-v="' + p[1] + '">' + p[0] + '</button>'; }).join('') + '</div>' +
    '<div class="lbl">체크포인트</div>' + ckList(t).map(function(c){
      return '<div class="ck' + (c.done ? ' done' : '') + '"><button class="tg green" data-ck="' + c.id + '">' + (c.done ? '✓' : '☐') + '</button>' +
        '<span>' + esc(c.text) + '</span><button class="rm" data-ckrm="' + c.id + '" aria-label="빼기">✕</button></div>'; }).join('') +
      '<input class="ckadd" id="sh-ck" placeholder="＋ 체크">' +
    '<div class="lbl">메모</div><textarea id="sh-memo">' + esc(t.memo || '') + '</textarea>' +
    '<div class="lbl">연결</div><input class="ref" id="sh-ref" value="' + esc(t.ref || '') + '">' +
    (function(){
      var logs = Object.keys(d.log || {}).map(function(k){ return d.log[k]; })
        .filter(function(l){ return l.task === ui.open; }).sort(function(a, b){ return b.ts - a.ts; })
        .map(function(l){ return { ts: l.ts, text: logLine(t, l) }; }).filter(function(l){ return l.text; }).slice(0, 10);
      return logs.length ? '<details' + (opened ? ' open' : '') + '><summary>기록</summary><ul class="log">' +
        logs.map(function(l){ return '<li><span>' + fmtTs(l.ts) + '</span><span>' + esc(l.text) + '</span></li>'; }).join('') + '</ul></details>' : '';
    })() +
    '<div class="danger"><button data-act="del">삭제</button></div>' +
    '</div>';
  sh.hidden = false;
  body = sh.querySelector('.sheet-body'); if (body && st) body.scrollTop = st;
}
function closeSheet(){
  ui.open = null; $('sheet').hidden = true; $('sheet').innerHTML = '';
  if (ui.view !== 'review' && (isPC() || $('in').value)) $('in').focus();
}
$('sheet').addEventListener('click', function(e){
  var id = ui.open, b = e.target.closest('button,[data-act]'); if (!b || !id) return;
  if (b.dataset.act === 'close') { closeSheet(); return; }
  if (b.dataset.act === 'emo') { openEmoji(id); return; }
  if (b.dataset.act === 'del') { deleteTask(id); closeSheet(); render(); return; }
  if (b.dataset.set) {
    var f = b.dataset.set, v = b.dataset.v;
    if (f === 'priority') v = +v;
    if (f === 'due' && !v) v = null;
    editTask(id, (function(o){ o[f] = v; return o; })({}), false); render(); return;
  }
  if (b.dataset.ck) {
    var t = store.load().tasks[id], c = t.checks[b.dataset.ck], done = !c.done;
    var o = {}; o['checks/' + b.dataset.ck + '/done'] = done; o['checks/' + b.dataset.ck + '/by'] = done ? 'me' : null; o['checks/' + b.dataset.ck + '/ts'] = done ? Date.now() : null;
    editTask(id, o, false); render(); return;
  }
  if (b.dataset.ckrm) { var o2 = {}; o2['checks/' + b.dataset.ckrm] = null; editTask(id, o2, '체크 삭제'); render(); return; }
});
$('sheet').addEventListener('change', function(e){
  var id = ui.open;
  if (e.target.id === 'sh-due') { editTask(id, { due: e.target.value || null }, e.target.value ? '마감 ' + dueKo(e.target.value) : '마감 지움'); render(); }
  else if (e.target.id === 'sh-title') { var v = e.target.value.trim(); if (v) editTask(id, { title: v }, '제목 고침'); render(); }
  else if (e.target.id === 'sh-memo') { editTask(id, { memo: e.target.value.trim() || null }, '메모'); render(); }
  else if (e.target.id === 'sh-ref') { editTask(id, { ref: e.target.value.trim() || null }, false); render(); }
});
$('sheet').addEventListener('keydown', function(e){
  var el = e.target;
  if (el.id === 'sh-ck') { if (e.key !== 'Enter' || e.isComposing) return;
    e.preventDefault(); var v = el.value.trim(); if (!v) return;
    var map = {}; addChecks(ui.open, [v], map, Date.now()); commit(map, false); render(); $('sh-ck').focus(); return; }
  if (el.id === 'sh-title' && e.key === 'Enter' && !e.isComposing) { e.preventDefault(); el.blur(); }
});

/* ── 아이콘 고르기 ── */
function openEmoji(id){
  ui.emoFor = id;
  $('emopick').innerHTML = '<div class="modal-body"><h2>아이콘<button data-act="close" aria-label="닫기">✕</button></h2>' +
    '<div class="emogrid">' + EMOJI.map(function(e){ return '<button data-e="' + e + '">' + e + '</button>'; }).join('') + '</div>' +
    '<button class="wide" data-e="">지우기</button></div>';
  $('emopick').hidden = false;
}
$('emopick').addEventListener('click', function(e){
  if (e.target === $('emopick') || e.target.closest('[data-act="close"]')) { $('emopick').hidden = true; return; }
  var b = e.target.closest('[data-e]'); if (!b) return;
  editTask(ui.emoFor, { icon: b.dataset.e || null }, b.dataset.e ? '아이콘 ' + b.dataset.e : '아이콘 지움');
  $('emopick').hidden = true; render();
});

/* ── 설정 ── */
function openSettings(){
  var d = store.load(), ex = d.meta.exam || {};
  $('settings').innerHTML = '<div class="modal-body"><h2>설정<button data-act="close" aria-label="닫기">✕</button></h2><div class="stack">' +
    '<button class="wide" data-act="json">JSON 복사</button><button class="wide" data-act="md">MD 복사</button>' +
    '<div class="lbl">화면</div><div class="seg">' + Object.keys(THEME_KO).map(function(k){
      return '<button data-theme="' + k + '"' + (tmTheme.get() === k ? ' class="on"' : '') + '>' + THEME_KO[k] + '</button>'; }).join('') + '</div>' +
    '<div class="lbl">시험 기간</div><div class="exam"><input type="date" id="ex-s" value="' + (ex.start || '') + '"> ~ <input type="date" id="ex-e" value="' + (ex.end || '') + '"></div>' +
    (sync.state.uid ? '<div class="lbl">계정</div><div class="acct">' + esc(sync.state.email || '') + '</div>' +
      '<button class="wide" data-act="logout">로그아웃</button>' : '') +
    '</div><div class="stamp">' + esc(BUILD) + (sync.state.at ? ' · 동기화 ' + sync.fmtT(sync.state.at) : '') + '</div></div>';
  $('settings').hidden = false;
}
$('gear').addEventListener('click', openSettings);
$('settings').addEventListener('click', function(e){
  if (e.target === $('settings')) { $('settings').hidden = true; return; }
  var th = e.target.closest('[data-theme]');
  if (th) { tmTheme.set(th.dataset.theme); applyTheme(th.dataset.theme); openSettings(); return; }
  var b = e.target.closest('[data-act]'); if (!b) return;
  if (b.dataset.act === 'close') $('settings').hidden = true;
  else if (b.dataset.act === 'json') copyText(JSON.stringify(store.load(), null, 2));
  else if (b.dataset.act === 'md') copyText(toMarkdown(store.load()));
  else if (b.dataset.act === 'logout') sync.signOut();
});
$('settings').addEventListener('change', function(e){
  if (e.target.id !== 'ex-s' && e.target.id !== 'ex-e') return;
  store.update({ 'meta/exam': { start: $('ex-s').value || null, end: $('ex-e').value || null } });
  render();
});
function toMarkdown(d){
  var rows = sortAll(d.tasks).filter(isListed);
  var line = function(t){ var c = ckCount(t); return '| ' + short(t.id) + ' | ' + (t.icon || '') + ' | ' + STATUS_KO[t.status] + ' | ' + AREA_KO[t.area] + ' | ' + PRI_KO[t.priority] + ' | ' + (t.due || '') + ' | ' + t.title.replace(/\|/g, '\\|') + ' | ' + (c.y ? c.x + '/' + c.y : '') + ' | ' + (t.memo || '').replace(/\|/g, '\\|').replace(/\n/g, ' ') + ' |'; };
  var head = '| id | 　 | 상태 | 영역 | 중요도 | 마감 | 제목 | 체크 | 메모 |\n|---|---|---|---|---|---|---|---|---|\n';
  var open = rows.filter(function(t){ return t.status === 'todo' || t.status === 'doing'; });
  var done = rows.filter(function(t){ return t.status === 'done'; });
  return '## 열린 항목 (' + open.length + ')\n\n' + head + open.map(line).join('\n') + '\n\n## 완료 항목 (' + done.length + ')\n\n' + head + done.map(line).join('\n') + '\n';
}
function copyText(s){
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(s).then(function(){ toast('복사됨'); }, function(){ fallbackCopy(s); toast('복사됨'); });
  else { fallbackCopy(s); toast('복사됨'); }
}
function fallbackCopy(s){ var ta = document.createElement('textarea'); ta.value = s; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) {} document.body.removeChild(ta); }

/* ── 토스트 ── */
function placeToast(){
  var el = $('toast'); if (el.hidden) return;
  if (isPC() || $('inbar').hidden) { el.style.bottom = ''; return; }
  el.style.bottom = (($('inbar').offsetHeight || 0) + (document.querySelector('nav').offsetHeight || 0) + 16) + 'px';
}
function toast(msg, undo){
  var el = $('toast');
  el.innerHTML = '<span>' + esc(msg) + '</span>' + (undo ? '<button id="undo">되돌리기</button>' : '<span style="width:6px"></span>');
  el.hidden = false;
  placeToast();
  if (undo) $('undo').addEventListener('click', function(){ undo(); el.hidden = true; render(); });
  clearTimeout(undoTimer);
  undoTimer = setTimeout(function(){ el.hidden = true; }, undo ? 5000 : 1500);   // 되돌리기 5초
}

applyTheme(tmTheme.get());
if (typeof matchMedia === 'function' && matchMedia('(prefers-color-scheme:dark)').addEventListener) {
  matchMedia('(prefers-color-scheme:dark)').addEventListener('change', function(){ applyTheme(tmTheme.get()); });
}
store.subscribe(function(){ render(); });
window.addEventListener('resize', chipFade);

/* 로그인 뒤에 그린다. firebaseConfig 가 없으면(M1 판) 예전처럼 바로 연다. */
function open_(){ $('login').hidden = true; render(); chipFade(); sync.paint(); $('in').focus(); }
function askLogin(msg){
  $('login').hidden = false; $('lg-msg').textContent = msg || '';
  $('main').innerHTML = ''; $('sub').textContent = ''; $('review').hidden = true;
}
$('loginform').addEventListener('submit', function(e){
  e.preventDefault();
  var b = this.querySelector('button'); b.disabled = true; $('lg-msg').textContent = '';
  sync.signIn($('lg-e').value.trim(), $('lg-p').value)['catch'](function(err){
    var m = { 'auth/invalid-credential': '이메일이나 비밀번호가 맞지 않는다.',
              'auth/invalid-email': '이메일 꼴이 아니다.',
              'auth/user-disabled': '사용 중지된 계정이다.',
              'auth/too-many-requests': '시도가 많아 잠겼다. 잠시 뒤 다시.',
              'auth/network-request-failed': '네트워크에 닿지 않는다.' }[err.code] || err.code;
    $('lg-msg').textContent = m;
  })['finally'](function(){ b.disabled = false; $('lg-p').value = ''; });
});

if (!firebaseConfig || typeof firebase === 'undefined') { open_(); }
else sync.boot(function(u){ if (u) open_(); else askLogin(''); });

</script>
