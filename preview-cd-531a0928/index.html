<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>중심원리 모의실험 — 수행평가</title>
<!-- ══════════════════════════════════════════════════════════════
     수행① 「중심원리 모의 실험」 — 학생용 (2026-09-28 신설)
     정본 노트: 작업노트/생물의유전_수행1_중심원리앱.md
     ★실시 = 컴퓨터실 전용 프로그램(_제작/프로그램 · 2026-10-15). 인터넷·DB 를 쓰지 않는다 —
       결과는 프로그램 폴더의 「결과」에 파일로 남고, 학생이 관리 프로그램 「제출」로 낸다.
     ★개인정보: 이 소스에는 명단·점수·정답표·코드표가 없다(코드표·교과서 그림은 빌드가 프로그램에만 넣는다).
       채점(정답표·scoreScene)은 교사 화면에만 있다.
     ★캡쳐 = 배치 기록 {칸: 부품} + 그 장면 그림. 교사 화면이 같은 sceneSvg 로 다시 그린다.
     ══════════════════════════════════════════════════════════════ -->
<style>
:root{
  --red:#C0392B;   --red-bg:#FDECEA;
  --blue:#1255A0;  --blue-bg:#E8F0FA;
  --green:#2A7A38; --green-bg:#E9F5EB;
  --amber:#E67E22; --amber-bg:#FDF0E3; --amber-ink:#8A4B08;
  --ink:#1A1A1A;   --sub:#555;  --line:#D5D8DE;  --paper:#fff;  --bg:#F4F6F9;
  --dna:#0F9B95;   --rna:#6C2BD9;  --ribo:#9A4B12;  --trna:#7A8A00;  --new:#AD1457;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6;
  font-family:"Malgun Gothic","맑은 고딕",AppleSDGothicNeo-Regular,"Apple SD Gothic Neo",sans-serif;
  -webkit-user-select:none;user-select:none;}
button{font:inherit;cursor:pointer;min-height:44px;min-width:44px;border-radius:10px;border:1.5px solid var(--line);
  background:#fff;padding:6px 14px;}
button.pri{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:700;}
button.go{background:var(--green);color:#fff;border-color:var(--green);font-weight:700;}
button:disabled{opacity:.45;cursor:default;}
input{font:inherit;font-size:18px;min-height:48px;padding:6px 12px;border:1.5px solid var(--line);border-radius:10px;width:100%;
  -webkit-user-select:text;user-select:text;}
.hide{display:none!important;}
.screen{max-width:1180px;margin:0 auto;padding:12px 14px 40px;}

/* 로그인 */
.login-card{max-width:440px;margin:40px auto;background:#fff;border-radius:16px;padding:24px 22px;box-shadow:0 2px 12px rgba(0,0,0,.08);}
.login-card h1{font-size:21px;margin:0 0 4px;color:var(--blue);}
.login-card .sub{color:var(--sub);font-size:15px;margin-bottom:16px;}
.field{margin-bottom:12px;}
.field label{display:block;font-weight:700;font-size:15px;margin-bottom:4px;}
.secpick{display:flex;gap:8px;}
.secpick button{flex:1;font-size:18px;font-weight:700;min-height:52px;}
.secpick button.on{background:var(--blue);color:#fff;border-color:var(--blue);}
.err{color:var(--red);font-weight:700;min-height:24px;white-space:pre-line;font-size:15px;}
.demo-banner{background:var(--amber-bg);color:var(--amber-ink);border:1.5px solid var(--amber);border-radius:10px;padding:8px 12px;font-size:15px;margin-bottom:12px;}

/* 평가 화면 머리 */
.topbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;background:#fff;border-radius:12px;padding:8px 14px;margin-bottom:10px;
  box-shadow:0 1px 4px rgba(0,0,0,.06);position:sticky;top:0;z-index:5;}
.topbar .who{font-weight:700;}
.away{margin-left:auto;font-weight:700;padding:4px 12px;border-radius:999px;background:var(--green-bg);color:var(--green);}
.away.bad{background:var(--red-bg);color:var(--red);}
.awaybox{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
.awaybox .away{margin-left:0;}
#btnFinish{min-height:44px;font-weight:700;}
#btnFinish:not(:disabled){background:var(--red);color:#fff;border-color:var(--red);}
.done{text-align:center;padding:80px 20px;font-size:24px;font-weight:700;color:var(--green);}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.tabs button{padding:6px 12px;font-size:15px;}
.tabs button.on{border-color:var(--blue);background:var(--blue-bg);color:var(--blue);font-weight:700;}
.tabs button.sent::after{content:" ✔";color:var(--green);font-weight:700;}
.tabs button.lock{opacity:.45;cursor:not-allowed;}
.subcount{font-weight:700;padding:4px 12px;border-radius:999px;background:var(--blue-bg);color:var(--blue);}
.sendstat{font-weight:700;padding:6px 12px;border-radius:10px;font-size:15px;}
.sendstat.none{background:#EEF0F3;color:var(--sub);}
.sendstat.sent{background:var(--green-bg);color:var(--green);}
.lockwarn{background:var(--red-bg);color:var(--red);border-radius:8px;padding:6px 10px;font-weight:700;margin:8px 0;}
.card{background:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.card h2{font-size:19px;margin:0 0 4px;}
.task{color:var(--sub);font-size:16px;margin:0 0 8px;line-height:1.55;}
.task b{color:var(--ink);font-size:17px;}
.task .qem{color:var(--red);font-size:20px;}   /* 전사 서술 발문의 묻는 곳(2026-10-28 교사 — 빨갛게 · 조금 크게) */
.task .noscore{margin:0 0 8px;padding:10px 12px;border-radius:10px;background:#FFF4D6;border:3px solid #E6A100;color:#7A4B00;font-weight:800;font-size:26px;text-align:center;}   /* ⓪ 복제 = 채점하지 않는 장면(2026-10-28 교사 — 크게) */
.task .must{margin:6px 0 2px;padding:6px 10px;border-radius:8px;background:var(--red-bg);color:var(--red);font-weight:700;font-size:17px;}
.task ul{margin:4px 0 0;padding-left:20px;}
.partg.picked{filter:drop-shadow(0 0 5px #1255A0) drop-shadow(0 0 2px #1255A0);}
.stage-wrap{width:100%;max-width:calc((100vh - 250px) * 1.695);margin:0 auto;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;touch-action:none;}
#stage{display:block;width:100%;height:auto;}
/* 번역 ②③④ 의 그림은 85%(2026-10-27 교사 — 화면 가득 커서 뒷자리에서 보기 쉽다) · 그림 안 글자도 함께 줄어든다.
   제목·지시사항 글자는 그대로(교사 — 「지시사항은 원래 크기로」) */
#scrExam.tlsmall #stageWrap{width:85%;max-width:calc((100vh - 250px) * 1.695 * .85);}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center;}
/* 쓰는 중이 아니면 흐리게(2026-10-27 교사 — 옆자리에서 읽히지 않게) · 마우스를 올리면 보인다(저장한 뒤에도) */
#txaText:not(:focus):not(:placeholder-shown){filter:blur(6px);}
#txaText:not(:focus):not(:placeholder-shown):hover{filter:none;}
/* 10초 동안 마우스도 안 움직이고 아무것도 안 쓰면 쓰는 중이어도 흐리게(2026-10-27 교사 — 모든 쓰기 칸) · 움직이거나 쓰면 바로 풀린다 */
body.idle #txaText:not(:placeholder-shown){filter:blur(6px)!important;}
/* 저장(캡쳐)한 번역 장면도 흐리게(2026-10-28 교사) — 마우스를 올려야 보이고, 10초 동안 입력이 없으면 올려 둔 채로도 다시 흐려진다 */
#stageWrap.sentblur #stage{filter:blur(8px);}
#stageWrap.sentblur:hover #stage{filter:none;}
body.idle #stageWrap.sentblur #stage{filter:blur(8px)!important;}
.task .ask{margin:6px 0 2px;padding:6px 10px;border-radius:8px;background:var(--blue-bg);color:var(--blue);font-weight:700;font-size:17px;}
.actions .hint{color:var(--sub);font-size:15px;}
#btnCap.offlook{opacity:.45;cursor:not-allowed;}   /* 저장한 장면 — 꺼진 모양만(5번 누르면 교사 저장 풀기 · 2026-10-27) */
.partg{cursor:grab;touch-action:none;}
.partg.dragging{cursor:grabbing;}

/* 모달 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px;}
.modal .box{background:#fff;border-radius:14px;max-width:880px;width:100%;max-height:96vh;overflow:auto;padding:16px;}
.modal h3{margin:0 0 8px;font-size:19px;}
.warn{background:var(--amber-bg);color:var(--amber-ink);border-radius:8px;padding:6px 10px;font-weight:700;margin:8px 0;}
.okmsg{background:var(--green-bg);color:var(--green);border-radius:8px;padding:6px 10px;font-weight:700;margin:8px 0;}
.pinrow{display:flex;gap:8px;align-items:center;margin-top:8px;}
/* ② 전사 서술 (2026-10-21) */
#txaHost svg{display:block;width:100%;height:auto;}
#txaText{display:block;width:100%;min-height:150px;margin-top:10px;font:inherit;font-size:17px;line-height:1.6;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;
  resize:vertical;-webkit-user-select:text;user-select:text;}
#txaText[readonly]{background:#F4F6F9;color:#333;}
.txa-cond{margin:6px 0 2px;padding:8px 12px;border-radius:8px;background:#F4F6F9;color:var(--ink);font-size:16px;border:1.5px solid var(--line);}
.txa-cond ol{margin:4px 0 0;padding-left:22px;}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:999px;z-index:60;font-size:16px;}
</style>
</head>
<body>

<!-- ① 로그인 -->
<div id="scrLogin" class="screen">
  <div class="login-card">
    <h1>🧬 중심원리 모의실험</h1>
    <div class="sub">수행평가 — 답안지 입력 코드를 먼저 입력하고, 반을 고른 뒤 학번·이름을 입력하시오.</div>
    <div id="noHost" class="demo-banner hide">이 화면은 컴퓨터실 프로그램(중심원리_수행평가.exe)으로 열어야 결과가 저장된다. 지금은 연습만 할 수 있다.</div>
    <div class="field"><label for="inCode">답안지 입력 코드 <span style="font-weight:400;color:var(--sub)">(답안지 오른쪽 위 6자)</span></label>
      <input id="inCode" maxlength="9" autocomplete="off" autocapitalize="characters" spellcheck="false" style="text-transform:uppercase;letter-spacing:2px"></div>
    <div class="field"><label>반</label>
      <div class="secpick" id="secPick">
        <button type="button" data-sec="B" onclick="pickSec('B')">B반</button><button type="button" data-sec="C" onclick="pickSec('C')">C반</button><button type="button" data-sec="D" onclick="pickSec('D')">D반</button>
      </div></div>
    <div class="field"><label for="inId">학번 (5자리)</label><input id="inId" inputmode="numeric" maxlength="5" autocomplete="off"></div>
    <div class="field"><label for="inName">이름</label><input id="inName" autocomplete="off"></div>
    <div class="field hide" id="hostField" style="margin-top:18px;padding-top:12px;border-top:1px dashed #CCC">
      <button type="button" style="width:100%" onclick="hostCheck()">🔧 저장 점검 (선생님용)</button>
      <div id="hostChk" style="font-size:15px;color:var(--sub);margin-top:4px"></div></div>
    <div class="err" id="loginErr"></div>
    <button class="pri" id="btnLogin" style="width:100%" onclick="doLogin()">들어가기</button>
    <button id="btnPractice" style="width:100%;margin-top:10px" onclick="offlinePractice()">연습으로 시작 (서열 연습 · 파일을 남기지 않는다)</button>
    <button id="btnPreview" class="hide" style="width:100%;margin-top:10px" onclick="enterPreview()">👩‍🏫 교사 미리보기로 들어가기 (순서 잠금 없음)</button>
  </div>
</div>

<!-- ② 종결 — 앞선 장면은 볼 수 없다 · 화면 이탈도 더 이상 기록하지 않는다 -->
<div id="scrDone" class="screen hide"><div class="done">✅ 활동이 종료되었다.</div><div id="doneInfo" class="login-card hide" style="max-width:640px"></div></div>

<!-- ③ 평가 -->
<div id="scrExam" class="screen hide">
  <div class="topbar">
    <span class="who" id="whoLabel"></span>
    <span id="setLabel" style="color:var(--sub);font-size:15px"></span>
    <select id="pvSet" class="hide" onchange="previewSet(this.value)" style="font-size:15px;min-height:40px"></select>
    <button id="btnFs" onclick="enterFullscreen()">⛶ 전체화면</button>
    <span class="subcount" id="subCount">제출 0/5</span>
    <span class="awaybox">
      <span class="away" id="awayLabel">화면 이탈 0회</span>
      <button id="btnFinish" onclick="finishExam()" disabled title="모든 장면을 저장해야 누를 수 있다">🏁 활동 종결</button>
    </span>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="card">
    <h2 id="scTitle"></h2>
    <div class="task" id="scTask"></div>
    <div class="stage-wrap" id="stageWrap"><svg id="stage" viewBox="0 0 1000 590" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <div id="txaBox" class="hide">
      <div class="stage-wrap" style="touch-action:auto;max-width:clamp(520px, calc((100vh - 470px) * 2.28), 900px)"><div id="txaHost"></div></div>
      <div class="actions">
        <button class="pri" id="txaPlay" onclick="TXP.toggle()" style="min-width:120px">▶ 재생</button>
        <button onclick="TXP.restart()">↺ 처음부터</button>
        <input type="range" id="txaSeek" min="0" max="1000" value="0" oninput="TXP.seek(this.value/1000)" aria-label="재생 위치" style="flex:1;min-width:200px;width:auto">
      </div>
      <textarea id="txaText" maxlength="600" placeholder="여기에 서술하시오." oninput="onTxaInput()"></textarea>
      <div class="hint" id="txaCount" style="text-align:right;color:var(--sub);font-size:14px"></div>
    </div>
    <div class="actions">
      <button id="btnClear" onclick="clearScene()">↻ 이 장면 비우기</button>
      <span class="sendstat none" id="sendStat"></span>
      <button class="go" id="btnCap" style="margin-left:auto" onclick="openCapture()">📸 캡쳐</button>
    </div>
  </div>
</div>

<!-- 저장 풀기(선생님용 · 2026-10-27) — 저장한 장면에서 꺼진 캡쳐 단추를 연달아 5번 -->
<div id="unlockModal" class="modal hide">
  <div class="box" style="max-width:440px">
    <h3>🔑 저장 풀기 (선생님용)</h3>
    <div style="font-size:15px;color:var(--sub);margin-bottom:8px">비밀번호를 입력하면 이 장면의 저장이 풀려 다시 고칠 수 있다.</div>
    <input id="unlockPw" type="password" autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter') tryUnlock()">
    <div class="err" id="unlockErr"></div>
    <div class="actions"><button onclick="closeUnlock()">취소</button><button class="pri" style="margin-left:auto" onclick="tryUnlock()">풀기</button></div>
  </div>
</div>

<!-- 캡쳐 미리보기 -->
<div id="capModal" class="modal hide">
  <div class="box">
    <div style="display:flex;align-items:center;gap:8px"><h3 style="flex:1">📸 캡쳐 미리보기 — <span id="capTitle"></span></h3><button onclick="closeCapture()">닫기</button></div>
    <div class="stage-wrap"><svg id="capSvg" viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <div id="capWarn" class="warn hide" style="white-space:pre-line"></div>
    <div class="lockwarn" id="capLock">⚠ 저장하면 이 장면은 다시 고칠 수 없고, 다음 장면이 열린다.</div>
    <div id="capOk" class="okmsg hide"></div>
    <div id="capNext" class="hide" style="text-align:right"><button class="pri" onclick="goNextAfterSend()">다음 장면으로 ▶</button></div>
    <div id="capSendArea">
      <div style="margin-top:8px" id="capSendMsg"></div>
      <div class="pinrow"><button class="go" id="btnSend" onclick="sendCapture()">💾 저장</button></div>
      <div class="err" id="capErr"></div>
    </div>
  </div>
</div>

<div id="toast" class="toast hide"></div>

<script>
'use strict';
/* ═════════════════ 실시 방식 (2026-10-15 교사) ═════════════════
   컴퓨터실 전용 프로그램으로만 실시한다 — 인터넷·DB 없음. 프로그램이 window.examHost(결과 폴더 쓰기·읽기)를 넣어 준다.
   브라우저로 그냥 열면 연습만 된다. 교사 미리보기 사본(_제작/_중심원리_미리보기.js)은 PREVIEW_COPY=true. */
/* ===OFFLINE-INJECT-BEGIN=== (_오프라인빌드.js 가 채운다 — ★정본(이 파일)에는 비워 둔다: 코드표·교과서 그림은 프로그램에만) */
var CODE_SHEET = {};
var OFFLINE_ASSETS = {};
/* ===OFFLINE-INJECT-END=== */
var PREVIEW_COPY = true;   /* 미리보기 사본 — node _중심원리_미리보기.js 로 다시 만든다. 고치지 말 것 */
var PREVIEW = false;   /* 교사 미리보기(미리보기 사본에서만): 순서 잠금·저장 뒤 잠금 없음 · 서열 바꾸기 */

/* ===SCENES-BEGIN=== (교사 화면과 한 글자도 다르지 않아야 한다 — 검사가 문다) */
var VB_W = 1000, STAGE_H = 440, VB_H = 590;
var SCENE_IDS = ['R','T2','L1','L2','L3'];     /* 전사 종결은 뺐다(2026-09-28 교사 — 눈치로 맞히는 문항) · ① 전사 개시는 ① 전사 서술에 합쳤다(2026-10-21 교사 — 애니메이션에 프로모터가 나온다) */

/* ===SETS-BEGIN=== (_서열생성.py 가 쓴다 — 손으로 고치지 말 것. 개인정보 아님)
   mRNA 25염기 = lead(AUG 앞 3·4·5 — 답안지마다) + mrna(개시코돈·코돈2·3·4·종결코돈) + trail(종결코돈 뒤 7·6·5) → 폴리펩타이드 A(아미노산 4개).
   P = 연습(모든 반) · B01~B30 = 가반 · C01~C30 = 나반 · D01~D30 = 다반(답안지 한 장 = 서열 한 벌).
   학생마다 roster/{학번}/sheet(예: B07-1 — 학생이 답안지 코드를 넣으면 채워진다)의 앞부분으로 서열을 고른다 */
var SETS = {
  P:{ name:'연습', lead:'UAAG', mrna:'AUGGGAACUUACUAG', trail:'CUGACG' },
  B01:{ name:'가-01', lead:'UGG', mrna:'AUGGCCCUUUGUUAG', trail:'GUUGAUA' },
  B02:{ name:'가-02', lead:'CCAU', mrna:'AUGGGUCCUAGGUAA', trail:'CCUAGA' },
  B03:{ name:'가-03', lead:'UCCC', mrna:'AUGAGCGUAGAUUGA', trail:'AUUGAC' },

  var t=String(text||'').trim(), lab=t ? sl.mark+' '+t : sl.mark, w=Math.max(120, Math.min(300, 16*lab.length+20)), x0=sl.x-60;
  return '<rect x="'+x0+'" y="'+(sl.y-22)+'" width="'+w+'" height="44" rx="8" fill="#fff" stroke="#1255A0" stroke-width="2.2"/>'+
    T(x0+w/2, sl.y, lab, t ? 17 : 24, '#1255A0', 'middle', 'bold');
}
/* 염기 단위 칸(fine · L1) — 칸이 겹치므로 누름 영역은 폭 19 로 나란히 두고(투명), 모양은 가까운 칸·마우스 올린 칸만 보인다(finev).
   finev 는 opacity 0 속성으로 둔다 — 저장 그림(PNG)엔 CSS 가 없어 그대로 숨는다 */
function fineSlot(sl){
  var hit, vis, c=KIND_COLOR[sl.kind];
  if (sl.kind==='ribo'){
    hit='<rect class="slot k-ribo fine" data-slot="'+sl.id+'" x="'+(sl.x-BW/2)+'" y="344" width="'+BW+'" height="36" fill="transparent"/>';
    vis='<g class="finev" data-slot="'+sl.id+'" opacity="0" pointer-events="none"><rect x="'+(sl.x-28.5)+'" y="344" width="57" height="28" rx="6" fill="'+c+'" fill-opacity=".3" stroke="'+c+'" stroke-width="3"/>'+
      '<path d="M '+(sl.x-7)+' 344 L '+sl.x+' 334 L '+(sl.x+7)+' 344 Z" fill="'+c+'"/></g>';
  } else {
    var sz=KIND_SIZE[sl.kind];
    hit='<rect class="slot k-'+sl.kind+' fine" data-slot="'+sl.id+'" x="'+(sl.x-BW/2)+'" y="'+(sl.y-sz.h/2)+'" width="'+BW+'" height="'+sz.h+'" fill="transparent"/>';
    vis='<rect class="finev" data-slot="'+sl.id+'" opacity="0" pointer-events="none" x="'+(sl.x-sz.w/2-4)+'" y="'+(sl.y-sz.h/2-4)+'" width="'+(sz.w+8)+'" height="'+(sz.h+8)+'" rx="10" fill="'+c+'" fill-opacity=".25" stroke="'+c+'" stroke-width="3.5"/>';
  }
  return hit+vis;   /* vis 가 hit 바로 뒤 — CSS 「.fine:hover + .finev」 */
}
function slotBox(sl, filled){
  var sz=KIND_SIZE[sl.kind], w=sz.w+8, h=sz.h+8;
  if (sl.fine) return filled ? '' : fineSlot(sl);
  if (sl.kind==='ribo'){   /* 「이 코돈에 P 자리가 오게」 — 코돈 아래 괄호 */
    return '<rect class="slot k-ribo'+(filled?' filled':'')+'" data-slot="'+sl.id+'" x="'+(sl.x-26)+'" y="349" width="52" height="20" rx="6"'+
      ' fill="#8A94A3" fill-opacity=".06" stroke="#8A94A3" stroke-width="2" stroke-dasharray="5 4"'+(filled?' opacity="0"':'')+'/>';
  }
  return '<rect class="slot k-'+sl.kind+(filled?' filled':'')+'" data-slot="'+sl.id+'" x="'+(sl.x-w/2)+'" y="'+(sl.y-h/2)+'" width="'+w+'" height="'+h+
    '" rx="10" fill="#8A94A3" fill-opacity=".06" stroke="#8A94A3" stroke-width="2" stroke-dasharray="7 5"'+(filled?' opacity="0"':'')+'/>';
}

/* ── 장면 7장. slots = 놓는 칸, parts = 아래쪽에 늘어놓는 요소. 정답표는 여기 없다(교사 화면에만). ── */
function buildScene(sid, setKey){
  var m=SETS[setKey].mrna, cod=codonsOf(m), bg='', fg='', extra=null, slots=[], parts=[], title='', task='', what='', must='', limit=null, need=null, write=null;   /* write = 이름을 쓰는 칸(㉠㉡㉢ · 2026-10-27) — 그림엔 기호만 · ★답은 종이 답안지 2번 (2) 에 쓴다(2026-10-27 교사 — 화면 쓰기 칸은 걷어 냄) */   /* must = 이 장면에서 꼭 할 일(안내문 맨 위에 강조) */   /* extra(배치) = 놓인 것에 따라 더 그릴 것 */   /* fg = 놓인 라이보솜보다 위에 그릴 것 */
  function enz(id,label){ return {id:id,kind:'enzyme',label:label}; }
  function lab(id,label){ return {id:id,kind:'label',label:label}; }
  function tr(anti){ var aa=aaOfAnti(anti); return {id:'t_'+anti,kind:'trna',anti:anti,aa:aa,label:'tRNA '+anti}; }
  function trBare(anti){ return {id:'t0_'+anti,kind:'trna',anti:anti,aa:'',bare:true,label:'tRNA '+anti+'(아미노산 없음)'}; }
  /* 방향이 거꾸로인 tRNA(2026-10-24 교사 — 방향성을 따져 고르게) — 안티코돈 글자는 같고 5′·3′ 이 좌우 반대(아미노산이 오른쪽 3′ 끝).
     그림대로면 안티코돈이 코돈과 평행 → 오답. 이름표는 학생 화면에 나오지 않는다(교사 화면·기록용) */
  function trRev(anti){ var t=tr(anti); t.id='tr_'+anti; t.rev=true; t.label+='(방향 거꾸로)'; return t; }
  function trBareRev(anti){ var t=trBare(anti); t.id='t0r_'+anti; t.rev=true; t.label+='(방향 거꾸로)'; return t; }
  var ARROWS=[{id:'ar_r',kind:'arrow',label:'→',stock:true},{id:'ar_l',kind:'arrow',label:'←',stock:true}];
  var ENDS=[{id:'e5',kind:'end',label:'5′'},{id:'e3',kind:'end',label:'3′'}];

  if (sid==='R'){
    title='⓪ DNA 복제 — 복제 분기점';
    task='복제 분기점에서 새 가닥 두 개가 합성되는 모습을 완성하시오.'; what='효소, 프라이머, 새 가닥의 이름, 합성 방향';
    /* 교과서 47쪽 그림 Ⅰ-32 — 그림(1000×641)을 x=160 부터 높이 440 에 맞춘다(0.6864배).
       분기점 (428,209) · 위 주형 끝 (823,13) · 아래 주형 끝 (810,424) */
    if (hasA('fork_bg')) bg+=imgA('fork_bg',160,0,686.4,440);
    else {
      bg+=duplex(175,428,195,223,20);
      bg+=L(428,195,823,13,'#5BB4D6',7)+L(428,223,810,424,'#5BB4D6',7);
      bg+=L(505,194,838,45,'#EE8A2E',6);                                    /* 선도 가닥 */
      bg+=L(507,228,620,285,'#EE8A2E',6)+L(650,302,756,357,'#EE8A2E',6)+L(760,359,827,392,'#EE8A2E',6); /* 지연 가닥 조각 */
      bg+=L(256,268,401,268,'#C7B3DA',5);
    }
    bg+=T(843,12,'3′',15,'#555')+T(830,432,'5′',15,'#555');                 /* 주형 가닥 끝(새 가닥 끝은 묻는 것이라 쓰지 않는다) */
    bg+=T(330,290,'DNA가 풀리는 방향',13,'#6B5B7B');
    /* 효소 칸 5 · 프라이머 칸 3 — 그중 일부는 비워 두어야 하는 자리다(정답표는 교사 화면에만) */
    slots=[
      {id:'eParent',   kind:'enzyme',x:288,y:224},
      {id:'polTop',    kind:'enzyme',x:500,y:180},
      {id:'eTop5',     kind:'enzyme',x:730,y:95},
      {id:'primerTop', kind:'primer',x:850,y:40},
      {id:'dirTop',    kind:'arrow', x:620,y:70},
      {id:'lblTop',    kind:'label', x:650,y:195},
      {id:'primerBot', kind:'primer',x:512,y:238},
      {id:'polBot',    kind:'enzyme',x:625,y:280},
      {id:'dirBot',    kind:'arrow', x:540,y:335},
      {id:'lig',       kind:'enzyme',x:758,y:359},
      {id:'lblBot',    kind:'label', x:760,y:265},
      {id:'primerC3',  kind:'primer',x:860,y:405}
    ];
    parts=[enz('dnapol','DNA 중합효소'),enz('dnapol2','DNA 중합효소'),enz('ligase','DNA 연결효소'),enz('rnapol','RNA 중합효소'),
      {id:'primer',kind:'primer',label:'프라이머'},{id:'primer2',kind:'primer',label:'프라이머'},
      lab('lead','선도 가닥'),lab('lag','지연 가닥')].concat(ARROWS);
  }
  else if (sid==='T2'){
    /* ① 전사 서술(2026-10-21 교사) — 끌어 놓을 칸이 없다. 애니메이션을 보고 서술한다(아래 textSceneSvg) · 장면 id 는 T2 그대로 */
    return {id:sid,kind:'text',anim:animOf(setKey),um:txaUMask(setKey),mk:txaMarkOf(setKey),title:'① 전사 — 애니메이션 서술',task:txaQ(animOf(setKey)),what:'',must:'',limit:null,need:null,bg:'',fg:'',extra:null,slots:[],parts:[]};
  }
  else {
    /* 번역 3장면 공통 — 64·65쪽 그림 Ⅱ-5 비율. mRNA 글자 칸 19px(코돈 57px = 라이보솜 주머니 간격).
       mRNA 글자 윗변 y=320 · 아랫변 344. P 자리 코돈 가운데 x=cP */
    var shift = sid==='L3' ? 3 : 0;           /* L3 은 코돈4가 P, 종결코돈이 A */
    var cP=400, cA=cP+57, cE=cP-57, MT=320, MB=344;
    /* mRNA 줄 = 장식 염기 + 답안지의 25염기(lead + mrna + trail) + 장식 염기. 장식 염기에는 AUG 가 생기지 않는다(검사) */
    var PAD_L='GCACUCGACC', PAD_R='GCACUCGACCGCACUCGACC', S0=SETS[setKey];
    var lead=PAD_L+(S0.lead||''), full=lead+m+(S0.trail||'')+PAD_R;
    var pStart=cP-28.5-(lead.length+shift*3)*BW;
    function mrnaRow(){
      var s=L(40,MB+2,960,MB+2,'#6C2BD9',3);
      /* 장식 염기는 흐리게 — 답안지 ② 의 25염기(lead + mrna + trail)만 또렷이(2026-10-24 교사 — 답안지와 달라 보여 헷갈렸다) */
      var in0=PAD_L.length, in1=PAD_L.length+(S0.lead||'').length+m.length+(S0.trail||'').length;
      /* ★학생 화면은 글자 대신 답안지 ② 의 번호(1~25)만(2026-10-27 교사 — 뒤에서 보아도 서열을 알 수 없게 · 답안지를 보고 푼다).
         색도 없앤다(색으로 염기를 짐작하지 못하게) · 장식 염기는 번호 없는 빈 칸. 교사 화면(SHOW_MRNA)은 글자 그대로 */
      var letters=(typeof SHOW_MRNA!=='undefined' && SHOW_MRNA);
      for (var i=0;i<full.length;i++){ var x=pStart+i*BW+BW/2; if (x<50||x>950) continue;
        var pad=(i<in0||i>=in1), y=(MT+MB)/2;
        var bb=letters ? baseBox(x,y,full.charAt(i),{w:17,h:24,op:.25,fs:13})
          : '<rect x="'+(x-8.5)+'" y="'+(y-12)+'" width="17" height="24" rx="4" fill="#F4F6F9" stroke="#8A94A3" stroke-width="1.6"/>'+(pad ? '' : T(x,y,String(i-in0+1),i-in0+1>=10?10:12,'#1A1A1A','middle','bold'));
        s+=pad ? '<g class="mpad" opacity=".5">'+bb+'</g>' : bb; }
      s+=T(28,(MT+MB)/2,'5′',14,'#555')+T(972,(MT+MB)/2,'3′',14,'#555')+T(70,372,'mRNA',14,'#5321A8','middle','bold');
      return s;
    }
    var LX=cP+10, LY=MT-KIND_SIZE.large.h/2, SY=MB+KIND_SIZE.small.h/2, TY=MT-KIND_SIZE.trna.h/2;
    function riboBg(pBox){   /* pBox 면 P 자리에 상자 tRNA(아미노산 없이 · ④ 종결 — 사슬은 따로 그린다). ③ 신장은 놓인 것에 따라 extra 가 그린다 */
      return '<g transform="translate('+LX+','+LY+')">'+drawRibo('large')+'</g>'+
             '<g transform="translate('+cP+','+SY+')">'+drawRibo('small')+'</g>'+
             (pBox ? '<g transform="translate('+cP+','+TY+')">'+drawTrnaBox('')+'</g>' : '');
    }
    if (sid==='L1'){
      title='② 번역 — 개시';
      task='번역이 시작되는 모습을 완성하시오.'; what='라이보솜, tRNA';
      must='먼저 라이보솜을 놓아 위치를 정하시오. 라이보솜을 놓으면 특정 코돈을 가리키는 지시선이 나타난다.\n번역 개시 단계이므로 아미노산-tRNA는 하나만 배치하시오.';   /* \n = 줄을 바꿔 ✏️ 를 한 번 더 붙인다(교사) */
      limit={trna:1};   /* 개시 단계에는 tRNA 가 하나뿐 — 하나를 놓으면 다른 tRNA 는 놓을 수 없다(2026-09-29 교사) */
      /* ★mRNA 줄을 밀지 않는다 — 답안지 1번 염기가 늘 L1_X1(2026-10-28 교사). 개시코돈의 화면 자리가 답안지마다 다르다 */
      pStart=L1_X1-BW/2-PAD_L.length*BW;
      bg+=mrnaRow();
      /* ★핵심: 라이보솜의 P 자리가 개시코돈(AUG) 위에 온다(2026-09-28 교사).
         라이보솜 자리 후보 = 염기 한 칸씩(2026-10-28 교사 — 코돈 단위 넷이면 정답이 늘 둘째 칸이었다).
         rbN = P 자리가 답안지 N~N+2번 염기 위 · tRNA 칸 tbN 도 같은 간격(코돈 단위로 두면 읽기틀이 드러난다) */
      slots=[];
      for (var n=1;n<=L1_N;n++) slots.push({id:'rb'+n,kind:'ribo',x:l1X(n),y:241.5,fine:1});
      for (var n2=1;n2<=L1_N;n2++) slots.push({id:'tb'+n2,kind:'trna',x:l1X(n2),y:TY,fine:1});
      var cAug=l1X(augAt(setKey));
      /* 코돈 이름은 끌어 놓지 않고 쓴다(2026-10-27 교사) — 칸에는 ㉠ 만 · 아래 쓰기 칸 */
      slots.push({id:'lblC',kind:'write',x:760,y:100,mark:'㉠'});
      write={slot:'lblC',mark:'㉠',ask:'지시선이 가리키는 코돈 ㉠의 명칭은 답안지 문항 2-(2)에 쓰시오.'};
      /* ★지시선은 라이보솜을 놓은 뒤에만 나타나고, 라이보솜을 어디에 두든 늘 개시코돈(AUG)을 가리킨다 → 오른쪽 위 이름칸
         (2026-10-01 교사 — 전에는 「놓인 라이보솜의 P 자리 아래 코돈」을 가리켜 P 자리를 틀리면 이름 묻기까지 흔들렸다). 라이보솜 위에 그린다(extra) */
      extra=function(lay){
        var placed=slots.some(function(sl){ return sl.kind==='ribo' && lay[sl.id]; });
        return placed ? codonLeader(cAug,704,106,true) : '';   /* 개시코돈 세 글자를 둘러싼 테두리 위쪽에서 ㉠ 으로 */
      };
      parts=[{id:'ribo',kind:'ribo',label:'라이보솜'},
        trRev(antiOf(cod[0])), tr(cod[0]), tr(antiOf(cod[0])), trRev(antiOf(cod[1])), tr(antiOf(cod[1])), trRev(cod[0])];   /* tRNA 마다 방향이 거꾸로인 짝(2026-10-27 교사) */
    }
    else if (sid==='L2'){
      title='③ 번역 — 신장';
      task='폴리펩타이드가 신장되는 모습을 완성하시오.'; what='tRNA, 라이보솜의 이동 방향';
      bg+=mrnaRow()+riboBg('');
      bg+=T(715,420,'라이보솜 이동 방향 :',15,'#1A1A1A','end','bold');   /* 소단위체 바로 오른쪽으로(2026-10-24 교사 — 830 은 멀었다) */
      /* ★펩타이드결합 형성(2026-10-27 교사 — 「P 자리 아미노산과 A 자리 아미노산을 억지로 엮은 것은 오류」):
         A 자리에 tRNA 를 놓으면 P 자리 tRNA 의 메싸이오닌이 떨어져 A 자리 tRNA 의 아미노산에 옮겨 붙는다 → P 자리 tRNA 는 빈 채로,
         메싸이오닌은 A 자리 아미노산의 왼쪽 위(④ 종결 사슬과 같은 간격 31·19)에 · 그 사이에 새 결합 → ㉡ 지시선은 그 결합 한가운데에서.
         놓기 전에는 P 자리 tRNA 가 메싸이오닌을 달고 있고 지시선은 없다 */
      var HY=TY+AA_Y, pAnti=antiOf(cod[0]), MET=aaFill(CODON_TABLE[cod[0]]), BK=bondOf(setKey);
      /* ㉡ = 수소결합(2026-10-28 교사)이면 A 자리에 새로 놓은 tRNA 의 안티코돈 오른쪽 끝 염기와 코돈 셋째 염기가 맞닿은 곳(y 319.5)을 가리킨다 —
         P 자리는 상자 tRNA(안티코돈 없음)라 거기를 가리킬 수 없다 → A 자리에 tRNA 를 놓은 뒤에 보인다 ·
         지시선은 새 tRNA 오른쪽으로 올라가 ㉡ 칸으로(교사 — tRNA 사이로 지나가지 않게) */
      var HBX=cA+BW, HBY=TY+89.5;
      extra=function(lay){
        var on=lay.A && lay.A!=='none';
        var s='<g transform="translate('+cP+','+TY+')">'+drawTrnaBox(on ? '' : MET)+'</g>';   /* 메싸이오닌은 상자 윗변 가운데 */
        if (!on) return s;
        if (BK==='hbond') s+='<path d="M '+HBX+' '+HBY+' L '+(cA+42)+' '+(HBY-20)+' L '+(cA+42)+' 110 L 640 110" fill="none" stroke="#1255A0" stroke-width="1.6" stroke-dasharray="5 3"/>'+
          '<circle cx="'+HBX+'" cy="'+HBY+'" r="5" fill="#1255A0" stroke="#fff" stroke-width="1.5"/>';   /* 새 tRNA 오른쪽(고리 바깥)으로 */
        var ax=cA+(/^tr_/.test(lay.A) ? -AA_X : AA_X), mx=ax-31, my=HY-19, bx=(mx+ax)/2, by=(my+HY)/2;   /* 거꾸로 tRNA 의 아미노산은 오른쪽 3′ 끝 */
        s+=L(mx+9,my+5.5,ax-9,HY-5.5,'#4A3B2A',4)+hexagon(mx,my,11,MET);
        if (BK==='hbond') return s;
        return s+'<circle cx="'+bx+'" cy="'+by+'" r="4" fill="#1255A0"/>'+
          /* 지시선: 결합 한가운데에서 곧장 위로 → 오른쪽 ㉡ 칸(아미노산 위를 지나지 않게) */
          '<path d="M '+bx+' '+by+' L '+bx+' 110 L 640 110" fill="none" stroke="#1255A0" stroke-width="1.6" stroke-dasharray="5 3"/>';
      };
      slots=[
        {id:'A',kind:'trna',x:cA,y:TY},
        {id:'E',kind:'trna',x:cE,y:TY},
        {id:'bond',kind:'write',x:700,y:110,mark:'㉡'},   /* 결합 이름은 쓴다(2026-10-27 교사) */

var TXP=(function(){
  var host=null, v=-1, t=0, playing=false, last=0;
  var reduce=!!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var tick=window.requestAnimationFrame ? function(f){ window.requestAnimationFrame(f); } : function(f){ setTimeout(function(){ f(Date.now()); },16); };
  function ui(){
    var b=document.getElementById('txaPlay'), s=document.getElementById('txaSeek');
    if (b) b.textContent=playing ? '⏸ 멈춤' : (t>=TXA_T.end ? '▶ 다시 재생' : '▶ 재생');
    if (s) s.value=Math.round(1000*t/TXA_T.end);
  }
  function draw(){ if (host) txaApply(host, v, t); ui(); }
  function frame(now){
    if (!playing) return;
    var dt=last ? (now-last)/1000 : 0; last=now;
    t=Math.min(TXA_T.end, t+Math.min(dt,0.05)); draw();
    if (t>=TXA_T.end){ playing=false; ui(); return; }
    tick(frame);
  }
  function start(){ playing=true; last=0; tick(frame); ui(); }
  return {
    mount:function(el, variant, um, mk){
      var uk=(um||[]).join();
      if (host===el && v===variant && el.getAttribute('data-um')===uk && el.getAttribute('data-mk')===(mk||'') && el.firstChild) return;   /* 같은 변형이면 다시 짓지 않는다(재생 위치 유지) */
      host=el; v=variant; playing=false; t=reduce ? TXA_T.end : 0; el.setAttribute('data-um', uk); el.setAttribute('data-mk', mk||'');
      el.innerHTML='<svg viewBox="0 0 '+TXA_W+' '+TXA_H+'" xmlns="http://www.w3.org/2000/svg" font-family="Malgun Gothic, 맑은 고딕, sans-serif">'+txaInner(v, t, 'txa', um, mk)+'</svg>';
      ui();
    },
    toggle:function(){ if (playing){ playing=false; ui(); return; } if (t>=TXA_T.end) t=0; start(); },
    restart:function(){ t=0; start(); },
    seek:function(f){ playing=false; t=txaC01(f)*TXA_T.end; draw(); },
    stop:function(){ playing=false; },
    get t(){ return t; }

})();

function findSnap(pos, slots, kind){
  var best=null, bestD=Infinity;
  slots.forEach(function(t){
    if (t.kind!==kind) return;
    if (kind==='ribo'){
      /* 라이보솜은 「P 자리가 어느 코돈 위에 오나」만 따진다 — 세로는 무대 안이면 된다(전에는 가운데 거리로 재서 잘 안 붙었다) */
      var dx=Math.abs(pos.x-t.x);
      if (dx<=(t.fine?BW/2:28.5) && pos.y>20 && pos.y<STAGE_H && dx<bestD){ best=t; bestD=dx; }
      return;
    }
    var d=Math.sqrt((pos.x-t.x)*(pos.x-t.x)+(pos.y-t.y)*(pos.y-t.y));
    var r=(kind==='ribo')?45:((kind==='large'||kind==='small'||kind==='rna')?110:SNAP_R);
    if (d<=r && d<bestD){ best=t; bestD=d; }

  return best;
}
/* 누르기로 고른 요소 {part, from, kind} — 드래그 없이 눌렀다 떼면 여기에 남는다 */
var picked=null;
function onPartDown(e){
  if (dragState || locked(state.cur)) return;
  picked=null;                                            /* 새로 누르면 앞의 고르기는 풀린다 */
  e.preventDefault();
  var el=e.currentTarget;
  /* ★맨 위로 올리는 appendChild 가 포인터 캡처를 풀어 버린다 — 먼저 옮기고 나서 캡처한다(실측으로 잡음) */

  if (el.setPointerCapture){ try{ el.setPointerCapture(e.pointerId); }catch(err){} }
  var tr=el.getAttribute('transform'), m=/translate\(([-\d.]+),([-\d.]+)\)/.exec(tr);
  dragState={ el:el, pid:e.pointerId, part:el.getAttribute('data-part'), from:el.getAttribute('data-from'),
    start:svgPoint(e), ox:+m[1], oy:+m[2], base:tr };
  el.classList.add('dragging');
  var pk=null; scenes[state.cur].parts.forEach(function(q){ if (q.id===dragState.part) pk=q.kind; });
  dragState.kind=pk;
  if (pk==='ribo' && dragState.from==='tray' && el.firstElementChild) el.firstElementChild.setAttribute('transform','scale(1)');
  if (pk==='ribo'){ el.setAttribute('opacity','.78'); riboMarksOn(document.getElementById('stage')); }   /* 코돈 글자가 비쳐 보이게 */
  document.getElementById('stage').setAttribute('data-drag', kindFull(state.cur, pk, dragState.from) ? 'full' : (pk||''));   /* 다 찼으면 어느 칸도 빛나지 않는다 */
  el.addEventListener('pointermove', onDragMove);
  el.addEventListener('pointerup', onDragEnd);
  el.addEventListener('pointercancel', onDragEnd);
}
/* ★라이보솜 자리 표지를 그림 위로 — 라이보솜을 끄는(또는 고른) 동안 코돈 아래 괄호가 그림에 가려 보이지 않았다(교사 지적).
   맨 위에 같은 표지를 한 벌 더 얹는다(누르면 그 자리에 놓인다 — class 가 같다) */
function riboMarksOn(svg){
  if (svg.querySelector('#riboMarks')) return;
  var h='<g id="riboMarks">';
  scenes[state.cur].slots.forEach(function(sl){
    if (sl.kind!=='ribo') return;
    if (sl.fine){ h+=fineSlot(sl); return; }
    h+='<rect class="slot k-ribo rmark" data-slot="'+sl.id+'" x="'+(sl.x-27)+'" y="344" width="54" height="28" rx="6" fill="#9A4B12" fill-opacity=".15" stroke="#9A4B12" stroke-width="2.5"/>'+
       '<path d="M '+(sl.x-7)+' 344 L '+sl.x+' 334 L '+(sl.x+7)+' 344 Z" fill="#9A4B12" pointer-events="none"/>';
  });

}
function setNear(svg, oldId, newId){
  if (oldId){ var o=svg.querySelectorAll('[data-slot="'+oldId+'"]'); for (var i=0;i<o.length;i++) o[i].classList.remove('near'); }
  if (newId){ var n=svg.querySelectorAll('[data-slot="'+newId+'"]'); for (var j=0;j<n.length;j++) n[j].classList.add('near'); }
}
function onDragMove(e){
  if (!dragState || e.pointerId!==dragState.pid) return;
  var p=svgPoint(e), d=dragState;
  d.el.setAttribute('transform','translate('+(d.ox+p.x-d.start.x)+','+(d.oy+p.y-d.start.y)+')');
  /* 지금 놓으면 붙을 칸을 더 밝게 */
  var t=findSnap({ x:d.ox+p.x-d.start.x, y:d.oy+p.y-d.start.y }, scenes[state.cur].slots, d.kind);
  var id=t?t.id:'';

}
function onDragEnd(e){

  if (Math.abs(p.x-d.start.x)+Math.abs(p.y-d.start.y) < 8){
    picked = (pk0Same(d)) ? null : { part:d.part, from:d.from, kind:d.kind };

  }

var lastPick=null;
/* 같은 요소를 다시 누르면 고르기를 푼다 */
function pk0Same(d){ return !!(lastPick && lastPick.part===d.part && lastPick.from===d.from && pickWasOn); }
var pickWasOn=false;
/* 빛나는 칸을 누르면 고른 요소를 그 칸에 놓는다. 다른 곳을 누르면 고르기를 푼다 */
function onStageDown(e){
  if (!picked || locked(state.cur)) return;
  var t=e.target;
  if (t.closest && t.closest('.partg')) return;           /* 다른 요소를 누르면 onPartDown 이 맡는다 */
  var el=t.closest ? t.closest('.slot') : null, sl=null;
  if (el) scenes[state.cur].slots.forEach(function(x){ if (x.id===el.getAttribute('data-slot')) sl=x; });
  if (sl && sl.kind===picked.kind){
    applyDrop(state.cur, picked.part, picked.from, { x:sl.x, y:sl.y });
    picked=null; lastPick=null; saveState();
  } else { picked=null; lastPick=null; }
  renderScene();
}
/* 장면이 한 종류의 개수를 묶어 두었는가(limit) — 이미 다 찼으면 보관함에서 더 놓을 수 없다.
   무대에 놓인 것을 옮기는 것은 된다(개수가 늘지 않는다) */
function kindFull(sid, kind, from){
  var sc=scenes[sid], lay=state.layouts[sid], n=0;
  if (!sc.limit || !sc.limit[kind] || from!=='tray') return false;
  var kindOf={}; sc.parts.forEach(function(p){ kindOf[p.id]=p.kind; });
  Object.keys(lay).forEach(function(k){ if (lay[k] && kindOf[lay[k]]===kind) n++; });
  return n>=sc.limit[kind];
}
/* 장면이 꼭 채우라고 한 칸(need) 중 빈 것의 이름 — 하나라도 있으면 캡쳐하지 못한다(검사가 직접 부른다) */
function missingNeed(sid){
  var sc=scenes[sid], lay=state.layouts[sid]||{};
  if (sc.kind==='text') return String(lay._text||'').replace(/\s/g,'').length<5 ? ['서술'] : [];   /* ② 서술은 비우고 저장할 수 없다 */
  return (sc.need||[]).filter(function(n){ return !lay[n[0]]; }).map(function(n){ return n[1]; });
}
/* 순수 규칙: 놓은 결과를 배치에 반영한다(검사가 직접 부른다) */
function applyDrop(sid, partId, from, pos){
  var sc=scenes[sid], lay=state.layouts[sid], part=null;
  sc.parts.forEach(function(p){ if (p.id===partId) part=p; });
  if (!part) return;
  if (kindFull(sid, part.kind, from)) return;   /* 다 찼다 → 제자리로 */
  var target=findSnap(pos, sc.slots, part.kind);
  if (from!=='tray') delete lay[from];
  if (!target) return;                     /* 칸 밖 → 제자리(아래쪽)로 */
  if (!part.stock){ Object.keys(lay).forEach(function(k){ if (lay[k]===partId) delete lay[k]; }); }
  lay[target.id]=partId;                   /* 칸에 있던 것은 제자리로 밀려난다 */
}

/* ═════════════════ 이탈 기록 ═════════════════ */
function awayBegin(kind){

function awayEnd(){

/* 쓰기 칸 흐림 — 10초 동안 아무 입력이 없으면 body.idle(2026-10-27 교사) · 마우스·키·터치·휠 중 무엇이든 하면 풀고 다시 잰다 */

/* ═════════════════ 학번 워터마크 (2026-09-29 교사) ═════════════════
   화면 캡쳐는 웹에서 막을 수 없다 → 캡쳐가 돌아다니면 누구 것인지 드러나게 반·학번을 비스듬히 깐다.
   ★화면 전체가 아니라 **무대 그림(캡쳐되는 이미지)의 흰 바탕 바로 위 · 그림 뒤에만**(교사) — 보관함·안내문에는 없다.
   사람 눈에는 아주 흐리고(불투명도 0.035), 캡쳐를 확대하거나 AI 로 보면 읽힌다. 누르기를 막지 않는다. 이름은 넣지 않는다 */
var WM_OPACITY = 0.035;

  for (var r=0, y=40; y<STAGE_H+40; r++, y+=110)
    for (var x=(r%2?-10:140); x<VB_W+150; x+=300)

/* 무대 그림 문자열의 흰 바탕 직후에 워터마크를 끼운다 — 장면 그림 함수(sceneSvg)는 교사 화면과 같아야 해서 건드리지 않는다 */

/* ═════════════════ 활동 종결 (2026-09-29 교사) ═════════════════

function tryUnlock(){
  var pw=document.getElementById('unlockPw').value;
  if (resultCheck({ unlock:pw })!==UNLOCK_HASH){ document.getElementById('unlockErr').textContent='비밀번호가 틀렸다.'; return; }
  var sid=state.cur;
  delete state.sent[sid]; delete state.sentAt[sid]; delete state.sentSnap[sid];
  (state.unlocks=state.unlocks||[]).push({ scene:sid, at:Date.now() });
  saveState(); closeUnlock(); renderScene();
  toast('🔓 '+TAB_NAME[sid]+' 저장을 풀었다. 고친 뒤 다시 캡쳐 → 저장하시오.');
}
function closeCapture(){ document.getElementById('capModal').classList.add('hide'); }
function goNextAfterSend(){ closeCapture(); var i=openIdx(); if (i<SCENE_IDS.length) goScene(SCENE_IDS[i]); }
var sending=false;
function sendCapture(){
  if (sending) return;
  var err=document.getElementById('capErr');
  if (missingNeed(state.cur).length){ err.textContent=scenes[state.cur].kind==='text' ? '서술을 입력하시오.' : missingNeed(state.cur).join('와 ')+'에 요소를 배치하시오.'; return; }
  var sid=state.cur, layout=JSON.stringify(state.layouts[sid]);
  sending=true; document.getElementById('btnSend').disabled=true; err.textContent='';
  /* 본평가: 그 장면 그림 + 결과 JSON 을 결과 폴더에 쓴다 — 써진 뒤에야 저장한 것으로 친다 */
  (session==='exam' ? offlineSave(sid, null) : Promise.resolve()).then(function(){
    state.sent[sid]=1; state.sentAt[sid]=Date.now(); state.sentSnap[sid]=layout; saveState();
    var ok=document.getElementById('capOk');
    ok.textContent=(session==='exam' ? '✅ 저장 완료('+me.code+'_'+SCENE_FILE[sid]+'.png). ' : (PREVIEW?'교사 미리보기이다 — 저장하지 않았다. ':'연습이다 — 저장하지 않았다. '))+'이 모습을 근거로 답안지에 서술하시오.';
    ok.classList.remove('hide'); document.getElementById('capSendArea').classList.add('hide');
    document.getElementById('capLock').classList.add('hide');
    if (openIdx()<SCENE_IDS.length) document.getElementById('capNext').classList.remove('hide');
    renderScene();
  }).catch(function(e){
    err.textContent = e&&e.code==='nofolder' ? '저장 폴더에 쓸 수 없다. 선생님께 알리시오. ('+(e.message||'')+')' : '저장하지 못했다. 다시 시도하시오. ('+((e&&e.message)||e)+')';
  }).then(function(){ sending=false; document.getElementById('btnSend').disabled=false; });
}

/* ═════════════════ 교과서 그림 불러오기 ═════════════════
   프로그램: 빌드가 넣은 그림(OFFLINE_ASSETS · data URI — 캔버스가 오염되지 않아 PNG 를 만들 수 있다).
   미리보기·브라우저: 이 PC 의 추출 폴더(gitignore). 없으면 SVG 로 대신 그린다. */
var ASSET_DIR = '../../../교과서_이미지/수행평가_요소/';
function loadAssets(done){
  var names=Object.keys(ASSET_META);
  if (names.every(function(n){ return OFFLINE_ASSETS[n]; })){ names.forEach(function(n){ ASSETS[n]=OFFLINE_ASSETS[n]; }); done(); return; }
  var left=names.length;
  names.forEach(function(n){
    var im=new Image(), url=ASSET_DIR+n+'.webp';
    im.onload=function(){ ASSETS[n]=url; if (!--left) done(); };
    im.onerror=function(){ if (!--left) done(); };
    im.src=url;
  });
}

/* ═════════════════ 로그인 — 반 · 학번 · 이름 · 답안지 입력 코드 ═════════════════
   종이 답안지를 섞어 나눠 주고, 학생이 받은 답안지의 코드를 넣으면 그 답안지(서열)가 정해진다(2026-10-08).
   코드표(CODE_SHEET)는 빌드가 프로그램에만 넣는다. 확인 뒤 offlineLogin 이 연결 파일·이어 하기를 맡는다. */
var pickedSec='';
function pickSec(k){
  pickedSec=k;
  var bs=document.querySelectorAll('#secPick button');
  for (var i=0;i<bs.length;i++) bs[i].classList.toggle('on', bs[i].getAttribute('data-sec')===k);
}
function normName(s){ return String(s||'').replace(/\s+/g,''); }
function loginErr(msg){ document.getElementById('loginErr').textContent=msg; }
function normCode(v){ return String(v||'').toUpperCase().replace(/[^0-9A-Z]/g,''); }
function codeShapeOk(c){ return /^[2-9A-HJKMNP-Z]{6}$/.test(c); }
function doLogin(){
  var id=document.getElementById('inId').value.trim(), name=normName(document.getElementById('inName').value);
  /* 코드를 먼저 확인한다(2026-10-27 교사 — 입력 칸도 코드가 맨 위). 반 대조는 반을 고른 뒤 offlineLogin 에서 */
  if (dirH){
    var code=normCode(document.getElementById('inCode').value);
    if (!code){ loginErr('답안지 오른쪽 위의 입력 코드를 입력하시오. (연습이면 아래 「연습으로 시작」)'); return; }
    if (!codeShapeOk(code) || !CODE_SHEET[code] || !setOfSheet(CODE_SHEET[code])){ loginErr('없는 코드이다. 답안지의 입력 코드를 다시 확인하시오.'); return; }
  }
  if (['B','C','D'].indexOf(pickedSec)<0){ loginErr('반을 고르시오.'); return; }
  if (!/^\d{5}$/.test(id)){ loginErr('학번은 숫자 5자리이다.'); return; }
  if (!name){ loginErr('이름을 입력하시오.'); return; }
  /* 명단 대조(2026-10-21) — 프로그램 안 해시 명단과 맞춰 본다. 명단이 없는 빌드·브라우저에서는 건너뛴다 */
  var H=(typeof window!=='undefined' && window.examHost) || null;
  if (!H || !H.checkStudent){ offlineLogin(id, name); return; }
  H.checkStudent(pickedSec, id, name).then(function(r){
    if (r && r.why){ loginErr(ROSTER_MSG[r.why] || '명단과 일치하지 않는다. 다시 확인하시오.'); return; }
    offlineLogin(id, name);
  }, function(){ loginErr('명단을 확인하지 못했다. 선생님께 알리시오.'); });
}
var ROSTER_MSG = {
  id:'명단에 없는 학번이다. 학번을 다시 확인하시오.',
  name:'학번과 이름이 명단과 일치하지 않는다. 이름을 다시 확인하시오.',
  sec:'선택한 반이 명단과 다르다. 반을 다시 확인하시오.'
};

/* ═════════════════ 교사 미리보기 (체험 모드 전용) ═════════════════ */
function enterPreview(){
  if (!PREVIEW_COPY) return;
  PREVIEW=true; me={ id:'00000', name:'교사 미리보기', sec:'', email:'' }; session='preview'; setKey='P';
  var sel=document.getElementById('pvSet');
  sel.innerHTML=Object.keys(SETS).map(function(k){ return '<option value="'+k+'">서열 '+esc(SETS[k].name)+' ('+k+')</option>'; }).join('');

  loadAssets(function(){ startExam({}); });
}
function previewSet(k){
  if (!PREVIEW || !SETS[k]) return;
  setKey=k; var cur=state.cur;
  SCENE_IDS.forEach(function(sid){ scenes[sid]=buildScene(sid,k); });
  sanitizeLayouts(); state.cur=cur; renderScene();
  document.getElementById('setLabel').textContent='교사 미리보기 · 서열 '+SETS[k].name;
}

/* ═════════════════ 결과 파일 (2026-10-08 오프라인 · 2026-10-15 프로그램 전용) ═════════════════
   · 로그인 = 반 · 학번 · 이름 · 입력 코드뿐. 저장 위치는 프로그램 폴더의 「결과」(고르지 않는다).
   · ★연결 정보와 코드 기반 자료를 나눈다(교사 결정):
       학번연결_{코드}.csv — 반·학번·이름·코드 (여기에만 학번·이름. Claude 는 읽지 않는다)
       {코드}.json · {코드}_{n}_{장면}.png · {코드}_전체.png — 코드만(학번·이름 없음)
   · 장면을 저장할 때마다 그 장면 그림과 JSON 을 쓴다 → PC 가 꺼져도 남는다. 다시 열면 JSON 으로 이어 한다.
   · 결과는 관리 프로그램의 「제출」로 교사에게 → 교사 화면이 모은 폴더를 읽어 채점한다 */
var dirH = null;
/* 프로그램(2026-10-15 — 컴퓨터실의 인터넷 차단이 브라우저 자체를 막는다 → 전용 프로그램 _제작/프로그램/)이
   window.examHost 를 넣어 준다 — 프로그램 폴더 안 「결과」 폴더에 바로 쓴다. 아래 쓰기·읽기가 돌도록 폴더 API 모양으로 감싼다. */
var HOST = (typeof window!=='undefined' && window.examHost) || null;
function hostDir(h){
  return { name:h.dirName, getFileHandle:function(n, o){
    return h.exists(n).then(function(ex){
      if (!ex && !(o && o.create)) throw new Error('NotFound');
      return {
        createWritable:function(){ var parts=[]; return Promise.resolve({
          write:function(d){ parts.push(d); return Promise.resolve(); },
          close:function(){ return new Blob(parts).arrayBuffer().then(function(b){ return h.write(n, new Uint8Array(b)); }); } }); },
        getFile:function(){ return h.read(n).then(function(b){ return new Blob([b]); }); } };
    });
  } };
}
/* 🔧 저장 점검(선생님용) — 결과 폴더에 그림·JSON 을 써 보고 다시 읽는다 */
function hostCheck(){
  var el=document.getElementById('hostChk'), t=Date.now(), name='점검_시험';
  el.textContent='점검 중이다…'; el.style.color='var(--sub)';
  svgToPng('<rect width="760" height="120" fill="#EAF3FF"/><text x="20" y="70" font-size="32" fill="#1255A0">저장 점검 '+esc(new Date(t).toLocaleString('ko-KR'))+'</text>', 760, 120, 1)
    .then(function(b){ return writeFileOut(name+'.png', b); })
    .then(function(){ return writeFileOut(name+'.json', JSON.stringify({ t:t, ua:navigator.userAgent })); })
    .then(function(){ return readFileText(name+'.json'); })
    .then(function(txt){
      if (!txt || JSON.parse(txt).t!==t) throw new Error('다시 읽은 내용이 다르다');
      el.innerHTML='✅ 저장 · 다시 읽기 성공 — 「'+esc(HOST.dirPath)+'」 에 '+name+'.png · '+name+'.json 이 생겼다. 이 두 파일을 관리 프로그램의 <b>제출</b>로 보내 보시오.';
      el.style.color='var(--green)';
    })
    .catch(function(e){ el.textContent='❌ 저장하지 못했다 — '+((e&&e.message)||e)+' (화면을 사진으로 찍어 두시오)'; el.style.color='var(--red)'; });
}
/* 결과 폴더에 쓰기 · 읽기 */
function writeFileOut(name, data){
  if (!dirH) return Promise.reject({ code:'nofolder', message:'프로그램으로 열지 않았다' });
  return dirH.getFileHandle(name, { create:true }).then(function(fh){ return fh.createWritable(); })
    .then(function(w){ return w.write(data).then(function(){ return w.close(); }); })
    .catch(function(e){ throw { code:'nofolder', message:(e&&e.message)||String(e) }; });
}
function readFileText(name){
  if (!dirH) return Promise.resolve(null);
  return dirH.getFileHandle(name).then(function(fh){ return fh.getFile(); }).then(function(f){ return f.text(); }, function(){ return null; });
}
/* 장면 그림(SVG 문자열) → PNG Blob. 그림은 data URI 라 캔버스가 오염되지 않는다 */
function svgToPng(inner, w, h, scale){
  scale=scale||1.5;
  var svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+w+' '+h+'" width="'+(w*scale)+'" height="'+(h*scale)+'" font-family="Malgun Gothic, 맑은 고딕, sans-serif">'+inner+'</svg>';
  return new Promise(function(res, rej){
    var im=new Image();
    im.onload=function(){
      try{
        var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
        var g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(im,0,0,c.width,c.height);
        c.toBlob(function(b){ b ? res(b) : rej(new Error('PNG 를 만들지 못했다')); }, 'image/png');
      }catch(e){ rej(e); }
    };
    im.onerror=function(){ rej(new Error('그림을 그리지 못했다')); };
    im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  });
}
function stageSvgOf(sid){ return stampWm(sceneSvg(scenes[sid], state.layouts[sid], false)); }
/* 다섯 장면 한 장 — 2열 × 3행 + 머리 줄(코드 · 시각) */
function summarySvg(doneAt){
  var W=VB_W, H=STAGE_H, top=70, gap=20, s='<rect width="'+(2*W+gap)+'" height="'+(top+3*(H+gap+34))+'" fill="#fff"/>'+
    '<text x="12" y="44" font-size="34" font-weight="700" fill="#1255A0">중심원리 모의 실험 — 코드 '+esc(me.code)+'</text>'+
    '<text x="'+(2*W+gap-12)+'" y="44" font-size="24" fill="#555" text-anchor="end">'+esc(new Date(doneAt||Date.now()).toLocaleString('ko-KR'))+'</text>';
  SCENE_IDS.forEach(function(sid, i){
    var x=(i%2)*(W+gap), y=top+Math.floor(i/2)*(H+gap+34);
    s+='<text x="'+(x+8)+'" y="'+(y+26)+'" font-size="24" font-weight="700" fill="#1A1A1A">'+esc(TAB_NAME[sid])+(state.sent[sid]?'':' (저장 안 됨)')+'</text>'+
       '<svg x="'+x+'" y="'+(y+34)+'" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">'+stageSvgOf(sid)+'</svg>'+
       '<rect x="'+x+'" y="'+(y+34)+'" width="'+W+'" height="'+H+'" fill="none" stroke="#BBB" stroke-width="2"/>';
  });
  return { svg:s, w:2*W+gap, h:top+3*(H+gap+34) };
}
/* 결과 JSON — 학번·이름은 넣지 않는다(코드만) */
function offlineRecord(extraSid, doneAt){
  var sc={};
  SCENE_IDS.forEach(function(k){
    if (state.sent[k]) sc[k]={ layout:state.sentSnap[k]||JSON.stringify(state.layouts[k]||{}), ts:state.sentAt[k]||0 };
    else if (k===extraSid) sc[k]={ layout:JSON.stringify(state.layouts[k]||{}), ts:Date.now() };
  });
  var o={ v:1, code:me.code, sheet:me.sheet, set:setKey, scenes:sc, away:{ n:state.away.n, ms:state.away.ms, fs:state.away.fs },
          awayLog:state.queue.slice(), unlocks:(state.unlocks||[]).slice(), doneAt:doneAt||null, savedAt:Date.now() };
  o.check=resultCheck(o);
  return o;
}
/* 장면 저장(sid) 또는 종결(doneAt) — 그림을 먼저, JSON 을 나중에(JSON 이 있으면 그림도 있다) */
function offlineSave(sid, doneAt){
  var files=[];
  var pic = sid ? svgToPng(stageSvgOf(sid), VB_W, STAGE_H).then(function(b){ var n=me.code+'_'+SCENE_FILE[sid]+'.png'; files.push(n); return writeFileOut(n, b); })
                : (function(){ var m=summarySvg(doneAt); return svgToPng(m.svg, m.w, m.h, 1).then(function(b){ var n=me.code+'_전체.png'; files.push(n); return writeFileOut(n, b); }); })();
  return pic.then(function(){
    var rec=offlineRecord(sid, doneAt), n=me.code+'.json'; files.push(n);
    return writeFileOut(n, new Blob([JSON.stringify(rec)], { type:'application/json' }));
  }).then(function(){ if (doneAt) files.push('학번연결_'+me.code+'.csv'); return files; });
}
/* 로그인 — 코드 → 답안지(반 대조) → 연결 파일 → 이어 하기 */
function offlineLogin(id, name){
  var code=normCode(document.getElementById('inCode').value), sheet=CODE_SHEET[code];
  if (!dirH){ loginErr('이 화면은 컴퓨터실 프로그램(중심원리_수행평가.exe)으로 열어야 결과가 저장된다. 연습은 아래 「연습으로 시작」을 누르시오.'); return; }
  if (!code){ loginErr('답안지 오른쪽 위의 입력 코드를 입력하시오. (연습이면 아래 「연습으로 시작」)'); return; }
  if (!codeShapeOk(code) || !sheet || !setOfSheet(sheet)){ loginErr('없는 코드이다. 답안지의 입력 코드를 다시 확인하시오.'); return; }
  /* 마스터 답안지(M01~M03 · 2026-10-27 교사 — 오류 때 내줄 예비)는 반 구분 없이 어느 반이든 들어간다 · ★코드는 소스에 적지 않는다(코드표는 빌드가 넣는다) */
  if (sheet.charAt(0)!=='M' && sheet.charAt(0)!==pickedSec){ loginErr('다른 반의 답안지이다. 자기 반 답안지를 받았는지 확인하시오.'); return; }
  var btn=document.getElementById('btnLogin'); btn.disabled=true; loginErr('확인 중이다…');
  var mapName='학번연결_'+code+'.csv';
  readFileText(mapName).then(function(old){
    if (old){
      var row=(old.replace(/^\ufeff/,'').split(/\r?\n/)[1]||'').split(',');
      if (row[1] && row[1]!==id) throw { code:'taken' };
      return;
    }
    var csv='\ufeff반,학번,이름,코드,답안지,시각\r\n'+[pickedSec, id, name, code, sheet, new Date().toISOString()].join(',')+'\r\n';
    return writeFileOut(mapName, csv);
  }).then(function(){ return readFileText(code+'.json'); }).then(function(txt){
    var remote={}, doneAt=null, prev=null;
    if (txt){
      try{ prev=JSON.parse(txt); }catch(e){ prev=null; }
      if (!prev || prev.code!==code || resultCheck(prev)!==prev.check) throw { code:'broken' };
      Object.keys(prev.scenes||{}).forEach(function(k){ remote[k]=prev.scenes[k]; });
      doneAt=prev.doneAt||null;
    }
    me={ id:id, name:name, sec:pickedSec, email:'', sheet:sheet, code:code };
    session='exam'; setKey=setOfSheet(sheet);
    loadAssets(function(){
      startExam(remote, doneAt, true);
      if (prev && state && !state.done){   /* 이탈 기록도 파일 것을 이어 받는다(이 PC 저장분이 지워졌어도) */
        var seen={}; state.queue.forEach(function(r){ seen[r.leftAt+'|'+r.kind]=1; });
        (prev.awayLog||[]).forEach(function(r){ if (!seen[r.leftAt+'|'+r.kind]) state.queue.push(r); });
        state.queue.sort(function(a,b){ return a.leftAt-b.leftAt; });
        state.away={ n:0, ms:0, fs:0 }; state.queue.forEach(function(r){ if (r.kind==='fs') state.away.fs++; else state.away.n++; state.away.ms+=r.ms||0; });
        saveState(); renderAway();
      }
    });
  }).catch(function(e){
    var c=e&&e.code;
    loginErr(c==='taken' ? '이 코드는 이미 다른 학번으로 시작되었다. 선생님께 알리시오.' :
      c==='broken' ? '결과 폴더의 결과 파일('+code+'.json)이 손상되었다. 선생님께 알리시오.' :
      c==='nofolder' ? '저장 폴더에 쓸 수 없다. 선생님께 알리시오.' : '들어가지 못했다. ('+(c||e)+')');
  }).then(function(){ btn.disabled=false; });
}
function offlinePractice(){
  var id=document.getElementById('inId').value.trim(), name=normName(document.getElementById('inName').value);
  me={ id:id||'00000', name:name||'연습', sec:pickedSec, email:'' }; session='practice'; setKey='P';
  loadAssets(function(){ startExam({}); });
}

/* ═════════════════ 시작 ═════════════════ */
(function init(){
  var st=document.getElementById('stage'); if (st && st.addEventListener) st.addEventListener('pointerdown', onStageDown);
  if (HOST){ dirH=hostDir(HOST); document.getElementById('hostField').classList.remove('hide'); return; }
  if (PREVIEW_COPY){ document.getElementById('btnPreview').classList.remove('hide'); return; }
  document.getElementById('noHost').classList.remove('hide');   /* 브라우저로 그냥 열었다 — 연습만 */
})();
