<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="업무판">
<meta name="theme-color" content="#ffffff">
<!-- 아이콘 한 벌로 탭·폰 홈 화면·PC 바로가기를 다 덮는다(2026-09-10).
     manifest 가 있어야 크롬이 「설치」를 띄우고 안드로이드 홈 화면 아이콘이 제 모양으로 붙는다. -->
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<title>업무판</title>
<style>
/* ── 노션 토큰 ─────────────────────────────────────────────────────────
   글자는 따뜻한 먹빛 #37352F 이고 순검정은 쓰지 않는다. 선은 거의 안 보이는 굵기.
   폰은 16px 이상으로 두고, 노션의 촘촘한 밀도(14/12px)는 PC 분기에서만 쓴다. */
:root{
  --bg:#fff; --ink:#37352F;
  --ink-60:rgba(55,53,47,.65); --ink-45:rgba(55,53,47,.45); --ink-30:rgba(55,53,47,.3);
  --line:rgba(55,53,47,.09); --line-2:rgba(55,53,47,.16);
  --hover:rgba(55,53,47,.06); --press:rgba(55,53,47,.12);
  --blue:#2383E2;
  --shadow:0 1px 2px rgba(15,15,15,.1);
  --sheet-shadow:rgba(15,15,15,.05) 0 0 0 1px,rgba(15,15,15,.1) 0 3px 6px,rgba(15,15,15,.2) 0 9px 24px;

  /* 태그 — 노션 라이트 팔레트 */
  --t-gray-b:#E3E2E0;   --t-gray-f:#32302C;
  --t-brown-b:#EEE0DA;  --t-brown-f:#442A1E;
  --t-orange-b:#FADEC9; --t-orange-f:#49290E;
  --t-yellow-b:#FDECC8; --t-yellow-f:#402C1B;
  --t-green-b:#DBEDDB;  --t-green-f:#1C3829;
  --t-blue-b:#D3E5EF;   --t-blue-f:#183347;
  --t-purple-b:#E8DEEE; --t-purple-f:#412454;
  --t-pink-b:#F5E0E9;   --t-pink-f:#4C2337;
  --t-red-b:#FFE2DD;    --t-red-f:#5D1715;

  /* 영역 색 아홉 — 노션 팔레트. ★영역 키(admin…)가 아니라 색 이름(orange…)에 매인다.
     영역은 판마다 다르고 교사가 만들므로 키를 CSS 에 박을 수 없다(2026-09-10) */
  --ac-gray:#787774;   --ac-brown:#9F6B53;  --ac-orange:#D9730D;
  --ac-yellow:#CB912F; --ac-green:#448361;  --ac-blue:#0B6E99;
  --ac-purple:#6940A5; --ac-pink:#AD1A72;   --ac-red:#E03E3E;
  /* 상태 점 */
  --todo:#91918E; --doing:#337EA9; --done:#448361;

  --nav-h:56px; --row-h:48px;
}

/* ── 어두울 때 — 노션의 밤 색. 값만 갈아 끼운다(구조는 그대로) ───────────
   시스템 설정을 따르되 [data-theme] 이 있으면 그쪽이 이긴다. */
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#191919; --ink:rgba(255,255,255,.81);
  --ink-60:rgba(255,255,255,.56); --ink-45:rgba(255,255,255,.44); --ink-30:rgba(255,255,255,.28);
  --line:rgba(255,255,255,.094); --line-2:rgba(255,255,255,.18);
  --hover:rgba(255,255,255,.055); --press:rgba(255,255,255,.1);
  --blue:#2E9AF5; --shadow:0 1px 2px rgba(0,0,0,.4);
  --sheet-shadow:rgba(255,255,255,.06) 0 0 0 1px,rgba(0,0,0,.4) 0 3px 6px,rgba(0,0,0,.5) 0 9px 24px;
  --t-gray-b:#5A5A5A;   --t-gray-f:rgba(255,255,255,.88);
  --t-brown-b:#603B2C;  --t-brown-f:rgba(255,255,255,.88);
  --t-orange-b:#854C1D; --t-orange-f:rgba(255,255,255,.88);
  --t-yellow-b:#89632A; --t-yellow-f:rgba(255,255,255,.88);
  --t-green-b:#2B593F;  --t-green-f:rgba(255,255,255,.88);
  --t-blue-b:#28456C;   --t-blue-f:rgba(255,255,255,.88);
  --t-purple-b:#492F64; --t-purple-f:rgba(255,255,255,.88);
  --t-pink-b:#69314C;   --t-pink-f:rgba(255,255,255,.88);
  --t-red-b:#6E3630;    --t-red-f:rgba(255,255,255,.88);
  --ac-gray:#979A9B;   --ac-brown:#BA856F;  --ac-orange:#C77D48;
  --ac-yellow:#CA9849; --ac-green:#529E72;  --ac-blue:#5E97C0;
  --ac-purple:#9A6DD7; --ac-pink:#E255A1;   --ac-red:#DF5452;
  --todo:#979797; --doing:#5E97C0; --done:#6E9B78;
} }
:root[data-theme="dark"]{
  --bg:#191919; --ink:rgba(255,255,255,.81);
  --ink-60:rgba(255,255,255,.56); --ink-45:rgba(255,255,255,.44); --ink-30:rgba(255,255,255,.28);
  --line:rgba(255,255,255,.094); --line-2:rgba(255,255,255,.18);
  --hover:rgba(255,255,255,.055); --press:rgba(255,255,255,.1);
  --blue:#2E9AF5; --shadow:0 1px 2px rgba(0,0,0,.4);
  --sheet-shadow:rgba(255,255,255,.06) 0 0 0 1px,rgba(0,0,0,.4) 0 3px 6px,rgba(0,0,0,.5) 0 9px 24px;
  --t-gray-b:#5A5A5A;   --t-gray-f:rgba(255,255,255,.88);
  --t-brown-b:#603B2C;  --t-brown-f:rgba(255,255,255,.88);
  --t-orange-b:#854C1D; --t-orange-f:rgba(255,255,255,.88);
  --t-yellow-b:#89632A; --t-yellow-f:rgba(255,255,255,.88);
  --t-green-b:#2B593F;  --t-green-f:rgba(255,255,255,.88);
  --t-blue-b:#28456C;   --t-blue-f:rgba(255,255,255,.88);
  --t-purple-b:#492F64; --t-purple-f:rgba(255,255,255,.88);
  --t-pink-b:#69314C;   --t-pink-f:rgba(255,255,255,.88);
  --t-red-b:#6E3630;    --t-red-f:rgba(255,255,255,.88);
  --ac-gray:#979A9B;   --ac-brown:#BA856F;  --ac-orange:#C77D48;
  --ac-yellow:#CA9849; --ac-green:#529E72;  --ac-blue:#5E97C0;
  --ac-purple:#9A6DD7; --ac-pink:#E255A1;   --ac-red:#DF5452;
  --todo:#979797; --doing:#5E97C0; --done:#6E9B78;
}
*{box-sizing:border-box}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",Helvetica,"Apple Color Emoji","Segoe UI Emoji",sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;height:100dvh;overflow:hidden;overflow-x:hidden;
}
button,.tap{min-height:44px;min-width:44px;font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer;border-radius:4px}
button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
input,textarea,select{font-family:inherit;font-size:16px;color:inherit;border:0;background:none}
ul,ol{margin:0;padding:0;list-style:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ── 머리 ───────────────────────────────────────────────────────────── */
#scroll{order:2;flex:1;overflow:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column}
header{padding:12px 16px 0;flex:none}
.pageicon{font-size:32px;line-height:1;margin-bottom:2px}
h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
/* 판 이름은 눌러서 고친다(교사 지시 2026-09-10). 평소엔 글자만 보이고 테두리는 없다 */
#pagetitle{width:100%;font-size:inherit;font-weight:inherit;letter-spacing:inherit;line-height:inherit;
  padding:0 4px;margin-left:-4px;border-radius:4px}
#pagetitle:hover{background:var(--hover)}
#pagetitle:focus{background:var(--hover);outline:none}
.sub{color:var(--ink-45);font-size:16px;margin-top:2px}

/* 판 탭 — 제목 위 한 줄. 판이 몇이든 옆으로 쓸어 본다(교사 지시 2026-09-10) */
.boards{display:flex;gap:2px;align-items:center;overflow-x:auto;scrollbar-width:none;flex:none;margin-bottom:4px}
.boards::-webkit-scrollbar{display:none}
.boards:empty{display:none}
.btab{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 10px;border-radius:6px;
      color:var(--ink-45);white-space:nowrap;flex:none;max-width:220px}
.btab:hover{background:var(--hover)}
.btab.on{background:var(--hover);color:var(--ink);font-weight:600}
.btab .nm{overflow:hidden;text-overflow:ellipsis}
/* ＋ 는 오른쪽 끝에 붙여 둔다 — 판이 셋만 돼도 폰에서는 화면 밖으로 밀렸다(2026-09-10 390px 실측) */
.btab.add{color:var(--ink-30);min-width:44px;justify-content:center;position:sticky;right:0;background:var(--bg)}
#pageicon{padding:0;border-radius:6px;display:block;text-align:left;min-height:0;min-width:0}
#pageicon:hover{background:var(--hover)}

/* 보기 탭 — 노션은 밑줄 2px 하나로 지금 보기를 알린다 */
.views{display:flex;gap:2px;align-items:center;margin-top:12px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;
  position:sticky;top:0;z-index:5;background:var(--bg);flex:none}
.views::-webkit-scrollbar{display:none}
.views button{padding:0 8px;height:44px;min-width:0;color:var(--ink-60);white-space:nowrap;border-radius:4px 4px 0 0;position:relative}
.views button:hover{background:var(--hover)}
.views button.on{color:var(--ink);font-weight:500}
.views button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink)}
.views .grow{flex:1;min-width:8px}
.views .gear{color:var(--ink-45)}
.views .gear:disabled{opacity:.3;cursor:default}
.views .gear:disabled:hover{background:none}

/* ── 입력줄 ─────────────────────────────────────────────────────────── */
#inbar{order:1;flex:none;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 12px}
#preview{display:flex;gap:4px;flex-wrap:wrap;min-height:0;margin-bottom:6px}
#preview:empty{display:none;margin:0}
.inrow{display:flex;gap:8px;align-items:center}
#in{flex:1;height:44px;padding:0 12px;background:var(--hover);border-radius:6px;min-width:0}
#in::placeholder{color:var(--ink-30)}
#go{width:44px;height:44px;background:var(--blue);color:#fff;border-radius:6px;font-weight:600;flex:none}
#pick{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.chips{display:flex;gap:4px;align-items:center;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
/* 영역 거르개 칩(본문). 입력창 아래 토큰 칩 줄은 폐지했다 — 교사 지시 2026-09-09 */
.chip{min-width:44px;height:44px;padding:0 10px;color:var(--ac,var(--ink-60));white-space:nowrap;flex:none;border-radius:4px;
      display:inline-flex;align-items:center;gap:4px}
.chip:hover{background:var(--hover)}
.chip.on{background:var(--hover);font-weight:500}
.chip .pen{color:var(--ink-45)}
.chip.add{color:var(--ink-30)}

/* ★영역 색 — 클래스 하나가 세 변수를 정하고, 쓰는 쪽은 var() 한 번이면 된다.
   .chip 은 --ac(진한 글자색), .row 는 --ac(왼쪽 띠), .seg button.on 은 --ab/--af(태그 색). */
.a-gray  {--ac:var(--ac-gray);  --ab:var(--t-gray-b);  --af:var(--t-gray-f)}
.a-brown {--ac:var(--ac-brown); --ab:var(--t-brown-b); --af:var(--t-brown-f)}
.a-orange{--ac:var(--ac-orange);--ab:var(--t-orange-b);--af:var(--t-orange-f)}
.a-yellow{--ac:var(--ac-yellow);--ab:var(--t-yellow-b);--af:var(--t-yellow-f)}
.a-green {--ac:var(--ac-green); --ab:var(--t-green-b); --af:var(--t-green-f)}
.a-blue  {--ac:var(--ac-blue);  --ab:var(--t-blue-b);  --af:var(--t-blue-f)}
.a-purple{--ac:var(--ac-purple);--ab:var(--t-purple-b);--af:var(--t-purple-f)}
.a-pink  {--ac:var(--ac-pink);  --ab:var(--t-pink-b);  --af:var(--t-pink-f)}
.a-red   {--ac:var(--ac-red);   --ab:var(--t-red-b);   --af:var(--t-red-f)}

/* ── 태그 칩 ────────────────────────────────────────────────────────── */
.tg{display:inline-flex;align-items:center;max-width:100%;height:24px;padding:0 8px;border-radius:4px;
    background:var(--t-gray-b);color:var(--t-gray-f);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg.gray{background:var(--t-gray-b);color:var(--t-gray-f)}
.tg.brown{background:var(--t-brown-b);color:var(--t-brown-f)}
.tg.orange{background:var(--t-orange-b);color:var(--t-orange-f)}
.tg.yellow{background:var(--t-yellow-b);color:var(--t-yellow-f)}
.tg.green{background:var(--t-green-b);color:var(--t-green-f)}
.tg.blue{background:var(--t-blue-b);color:var(--t-blue-f)}
.tg.purple{background:var(--t-purple-b);color:var(--t-purple-f)}
.tg.pink{background:var(--t-pink-b);color:var(--t-pink-f)}
.tg.red{background:var(--t-red-b);color:var(--t-red-f)}
.dot{display:inline-flex;align-items:center;justify-content:center;flex:none}
.dot i{width:10px;height:10px;border-radius:50%;background:var(--todo);font-style:normal;display:block}
.dot.off{cursor:default}
.s-todo i{background:var(--todo)}
.s-doing i{background:var(--doing)}
.s-done i{background:var(--done)}
.stat{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:4px;background:var(--t-gray-b);color:var(--t-gray-f);white-space:nowrap}
.stat.s-doing{background:var(--t-blue-b);color:var(--t-blue-f)}
.stat.s-done{background:var(--t-green-b);color:var(--t-green-f)}

/* ── 본문 ───────────────────────────────────────────────────────────── */
main{flex:1 0 auto;padding:0 8px 24px}
.gh{display:flex;align-items:center;gap:6px;padding:0 8px;height:44px;position:sticky;top:44px;background:var(--bg);z-index:2}
.gh .fold{width:44px;height:44px;color:var(--ink-45);display:flex;align-items:center;justify-content:center}
.gh .fold b{font-style:normal;font-weight:400;display:block;transition:transform .12s ease}
.gh.closed .fold b{transform:rotate(-90deg)}
.gh b{color:var(--ink-45);font-weight:400;margin-left:6px}
.gh .add{margin-left:auto;color:var(--ink-45);width:44px;height:44px}
.gh .add:hover{background:var(--hover)}

/* 행 — 폰에서는 두 줄짜리 목록, PC 에서는 표의 한 줄 */
.row{display:flex;align-items:center;gap:8px;min-height:48px;padding:6px 8px;border-bottom:1px solid var(--line);
     border-left:3px solid var(--ac,transparent);cursor:pointer}
.row:hover{background:var(--hover)}
.row.stale .main{opacity:.55}
.row .dot{width:28px;height:44px;margin-left:-6px}
.row .emo{flex:none;width:22px;text-align:center}
/* 아이콘이 없으면 칸도 없앤다 — 이사해 온 항목은 전부 빈칸이라 들여쓰기만 넓어 보였다(2026-09-10) */
.row .emo:empty,.card .emo:empty{display:none}
/* 폰 행 = [점][이모지][제목] / 그 아래 메타 한 줄. 점·이모지는 두 줄에 걸친다.
   inline 이면 넷이 통째로 세로로 쌓여 행이 108px 가 된다(2026-09-09 실측) */
.row .main{flex:1;min-width:0;display:grid;grid-template-columns:auto auto minmax(0,1fr);
           grid-template-areas:"dot emo ttl" "dot emo meta";align-items:center;column-gap:6px}
.row .main>.dot{grid-area:dot}
.row .main>.emo{grid-area:emo}
.row .main>.ttl{grid-area:ttl}
.row .main>.meta{grid-area:meta}
.row .ttl{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.s-done .ttl{color:var(--ink-45);text-decoration:line-through}
.row .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:3px;color:var(--ink-45)}
.row .dn{color:var(--ink-45)}
/* 마감 지남·오늘 — 영역과 뜻이 다르니 팔레트 색을 직접 박는다(--ac 를 빌려 쓰지 않는다) */
.row .dn.over{color:var(--ac-red);font-weight:500}
.row .dn.now{color:var(--ac-orange);font-weight:500}
.row .id{color:var(--ink-30);font-variant-numeric:tabular-nums}
.dn.ok{color:var(--done)}
.ph{color:var(--ink-30)}
/* 폰 meta 줄은 누르는 자리다 — 영역·중요도·마감·체크를 그 자리에서 고친다(교사 지시 2026-09-09) */
.row .meta [data-edit]{display:inline-flex;align-items:center;min-height:34px;padding:0 2px;border-radius:4px}
.row .meta [data-edit]:active{background:var(--hover)}
/* ★PC 표의 5칸은 폰에서 그리지 않는다 — 폰 행은 .main 두 줄이 전부다.
   이 규칙이 없어 폰에서 6칸이 한 줄에 들어차 제목이 0px 로 짓눌렸다(2026-09-09) */
.row .c-stat,.row .c-due,.row .c-area,.row .c-pri,.row .c-ck{display:none}
.empty{padding:32px 12px;color:var(--ink-30);text-align:center}
/* 표에서 바로 고치기 — 칸을 누르면 고르는 판이 뜨거나 그 자리에 입력칸이 생긴다 */
[data-edit]{cursor:pointer}
.menu{position:fixed;z-index:60;background:var(--bg);border-radius:6px;box-shadow:var(--sheet-shadow);
      padding:4px;display:flex;flex-direction:column;gap:2px;min-width:150px}
.menu button{display:flex;align-items:center;justify-content:flex-start;min-height:44px;padding:0 8px;border-radius:4px}
.menu button:hover{background:var(--hover)}
.menu button.on{background:var(--hover);box-shadow:inset 0 0 0 1.5px var(--line-2)}
/* 마감일 판 — 빠른 날짜 넷 · 직접 고르기 · 마감 없음 */
.menu b{margin-left:auto;padding-left:12px;color:var(--ink-45);font-weight:400}
.menu .sep{height:1px;background:var(--line);margin:3px 0;flex:none}
.menu input[type="date"]{width:100%;height:44px;padding:0 8px;background:var(--hover);border-radius:4px}
.menu .none{color:var(--ink-60)}
/* 영역 고치는 작은 판 — 이름 · 색 아홉 · 빼기 */
.menu .nmin{width:100%;height:44px;padding:0 8px;background:var(--hover);border-radius:4px}
.swatch{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:4px 0}
.swatch button{min-width:0;min-height:44px;height:44px;border-radius:4px;background:var(--ab);color:var(--af)}
/* ★특정도 — 위의 `.menu button.on{background:var(--hover)}` 가 더 세서 고른 색칸이 회색이 됐다
   (2026-09-10 브라우저 실측). 같은 깊이를 줘야 제 색이 남는다 */
.menu .swatch button.on{background:var(--ab);box-shadow:inset 0 0 0 2px var(--ink-45)}
.menu .rmv{color:var(--ac-red)}

}

            createdBy: 'me', ok: true, createdAt: ts, updatedAt: ts, doneAt: null };
  if (p.due) t.due = p.due;
  if (p.memo) t.memo = p.memo;
  if (p.checks.length) { t.checks = {}; p.checks.forEach(function(text, i){ t.checks['c' + pushKey(ts + i)] = { text: text, done: false, by: null, ts: null, order: i + 1 }; }); }
  map['tasks/' + id] = t;
  logEntry(map, id, 'create', null, p.title, ts);
  if (bid) map['boards/' + bid + '/lastArea'] = p.area;   // 마지막에 쓴 영역은 판마다 따로 기억한다
  commit(map, '추가됨 ' + short(id));
  return id;
}
// 지우면 지운다. 되돌릴 길은 5초 토스트와 _cli.js restore 둘뿐 — 휴지통은 두지 않는다.
function deleteTask(id){
  var d = store.load(), t = d.tasks[id]; if (!t) return;
  var map = {};
  map['tasks/' + id] = null;
  Object.keys(d.log || {}).forEach(function(k){ if (d.log[k].task === id) map['log/' + k] = null; });
  commit(map, '지움 ' + short(id));
}
function applyPatch(id, patch){
  var fields = {}, ts = Date.now(), map = {};
  Object.keys(patch).forEach(function(k){ if (k !== 'checks+') fields[k] = patch[k]; });
  if (patch['checks+']) addChecks(id, patch['checks+'], map, ts);
  fillEdit(map, id, fields, ts);
  if (Object.keys(map).length) commit(map, '수정됨 ' + short(id));
}
function cycleStatus(id){
  var t = store.load().tasks[id]; if (!t) return;
  var next = { todo: 'doing', doing: 'done', done: 'todo' }[t.status] || 'todo';
  editTask(id, { status: next }, STATUS_KO[next] + ' ' + short(id));
}

/* ── 화면 상태 ── */
var ui = { view: 'all', board: null, areaFilter: null, open: null, emoFor: null,
           fold: { done: true } };

/* ── 조각 ── */
function tag(cls, text){ return '<span class="tg ' + cls + '">' + esc(text) + '</span>'; }
function statTag(t){
  var g = t.status === 'done' ? '✓' : '';
  return '<span class="stat s-' + t.status + '"><span class="dot s-' + t.status + '"><i>' + g + '</i></span>' + STATUS_KO[t.status] + '</span>';
}
function ymdOf(ts){ var x = new Date(ts); return x.getFullYear() + '-' + pad2(x.getMonth() + 1) + '-' + pad2(x.getDate()); }
// 완료한 것에는 디데이를 붙이지 않는다 — 마감일 옆에 「완료 M월 D일」을 둔다(교사 지시 2026-09-09)
function doneKo(t){ return t.doneAt ? '완료 ' + dueKo(ymdOf(t.doneAt)) : ''; }
function sortDone(items){
  return items.sort(function(a, b){ return (b.doneAt || b.updatedAt || 0) - (a.doneAt || a.updatedAt || 0); });
}
function dueCell(t, today){
  if (t.status === 'done') return (t.due ? '<span class="dn">' + dueKo(t.due) + '</span>' : '') +
    (t.doneAt ? '<span class="dn ok">' + doneKo(t) + '</span>' : '');
  if (!t.due) return '';
  var n = Math.round((dParse(t.due) - dParse(today)) / DAY);
  return '<span class="dn' + (n < 0 ? ' over' : n === 0 ? ' now' : '') + '">' + dueKo(t.due) + '</span>';
}
function metaDue(t, today){
  // 이사해 온 완료 항목은 완료일이 없다 — 그럴 때는 마감일을 보여 준다(빈 「–」보다 낫다)
  if (t.status === 'done') return t.doneAt ? '<span class="dn ok">' + doneKo(t) + '</span>'
    : (t.due ? '<span class="dn">' + dueKo(t.due) + '</span>' : '<span class="ph">–</span>');
  if (!t.due) return '<span class="ph">–</span>';
  return '<span class="dn' + (dParse(t.due) < dParse(today) ? ' over' : t.due === today ? ' now' : '') + '">' + dLabel(t.due, today) + '</span>';
}
function ckCells(t){
  return ckList(t).slice(0, 3).map(function(c){ return tag('green' + (c.done ? ' done' : ''), (c.done ? '✓ ' : '') + c.text); }).join('') +
    (ckList(t).length > 3 ? '<span class="id">+' + (ckList(t).length - 3) + '</span>' : '');
}
// 표의 한 줄. PC 에서는 grid 로 6칸이 되고 폰에서는 두 줄짜리 목록이 된다.
function rowHtml(t, today){
  var c = ckCount(t);
  var glyph = t.status === 'done' ? '✓' : '';
  return '<li class="row ' + areaClassOf(t) + ' s-' + t.status + (isStale(t) ? ' stale' : '') + '" data-id="' + t.id + '">' +
    '<span class="main" data-act="open">' +
      '<button class="dot" data-act="cycle" aria-label="상태"><i>' + glyph + '</i></button>' +
      '<span class="emo">' + esc(t.icon || '') + '</span>' +
      '<span class="ttl">' + esc(t.title) + '</span>' +
      '<span class="meta">' +
        '<span class="m-area" data-edit="area">' + areaTagOf(t) + '</span>' +
        '<span class="m-pri" data-edit="priority">' + (t.priority !== 2 ? tag(PRI_TAG[t.priority], PRI_KO[t.priority]) : '<span class="ph">–</span>') + '</span>' +
        '<span class="m-due" data-edit="due">' + metaDue(t, today) + '</span>' +
        '<span class="m-ck' + (c.y ? ' has' : '') + '" data-edit="checks">☑' + (c.y ? c.x + '/' + c.y : '') + '</span></span>' +
    '</span>' +
    '<span class="c-stat" data-edit="status">' + statTag(t) + '</span>' +
    '<span class="c-due" data-edit="due">' + dueCell(t, today) + '</span>' +
    '<span class="c-area" data-edit="area">' + areaTagOf(t) + '</span>' +
    '<span class="c-pri" data-edit="priority">' + (t.priority !== 2 ? tag(PRI_TAG[t.priority], PRI_KO[t.priority]) : '') + '</span>' +
    '<span class="c-ck" data-edit="checks">' + ckCells(t) + '</span></li>';
}
var THEAD = '<div class="thead"><span>Aa 업무</span><span>☼ 상태</span><span>📅 마감일</span>' +
            '<span>◉ 영역</span><span>◉ 중요도</span><span>≔ 체크포인트</span></div>';
function ghHtml(label, n, key, closed){
  return '<li class="gh' + (key ? ' fold' : '') + (closed ? ' closed' : '') + '"' + (key ? ' data-act="fold" data-g="' + key + '"' : '') + '>' +
    (key ? '<span class="fold"><i>▾</i></span>' : '<span class="fold"></span>') +
    '<span>' + esc(label) + '<b>' + n + '</b></span></li>';
}

/* ── 그리기 ── */
function render(){
  closeMenu();
  paintUndo();
  ensureBoards();
  var d = store.load(), today = todayStr();
  var q = $('in').value;
  var pr = q.trim() ? parse(q, curArea(), today, d.tasks, curAreas()) : null;
  var filt = pr && !pr.editId && !pr.fallback ? pr.title.toLowerCase() : '';
  var match = function(t){ return !filt || (t.title + ' ' + (t.memo || '')).toLowerCase().indexOf(filt) >= 0; };
  var bid = curBoardId(d), board = (d.boards || {})[bid] || {};
  var open = taskList(d.tasks).filter(function(t){ return isOpen(t) && boardOf(t, d) === bid; });

  renderBoards(d, bid);
  $('pageicon').textContent = board.icon || '🗂️';
  var pt = $('pagetitle');
  if (document.activeElement !== pt) pt.value = board.name || d.meta.title || '학교업무';
  document.querySelectorAll('[data-view]').forEach(function(b){ b.classList.toggle('on', b.dataset.view === ui.view); });
  $('inbar').hidden = ui.view === 'review';
  $('review').hidden = ui.view !== 'review';
  $('main').hidden = ui.view === 'review';
  $('reqbtn').classList.toggle('on', !!d.meta.reviewReq);

  var m = $('main');
  if (ui.view === 'all') m.innerHTML = viewTable(d, today, match);
  else if (ui.view === 'board') m.innerHTML = viewBoard(d, today, match);

  renderPreview(pr);

/* 판 탭 — 제목 위 한 줄. 맨 끝의 ＋ 로 판을 더한다 */
function renderBoards(d, bid){
  var el = $('boards'); if (!el) return;
  el.innerHTML = boardList(d).map(function(b){
    return '<button class="btab' + (b.id === bid ? ' on' : '') + '" data-board="' + b.id + '">' +
      (b.icon ? '<span class="emo">' + esc(b.icon) + '</span>' : '') +
      '<span class="nm">' + esc(b.name || '판') + '</span></button>';
  }).join('') + '<button class="btab add" data-act="newboard" aria-label="판 더하기">＋</button>';
}
/* 영역 줄 — 한 번 누름 = 거르기 · 다시 = 풀기 · ✎ = 이름·색 고치기 · ＋ = 새 영역.
   고르는 자리와 고치는 자리를 겹치지 않게 ✎ 를 따로 뒀다(2026-09-10) */
function areaChips(){
  var d = store.load(), bid = curBoardId(d);
  return '<div class="chips" id="areachips">' + areaList(d, bid).map(function(a){
    var on = ui.areaFilter === a.key;
    return '<button class="chip a-' + (a.color || 'gray') + (on ? ' on' : '') + '" data-area="' + esc(a.key) + '">' +
      esc(a.name || a.key) + (on ? '<span class="pen" data-arearef="' + esc(a.key) + '">✎</span>' : '') + '</button>';
  }).join('') + '<button class="chip add" data-act="newarea" aria-label="영역 더하기">＋</button></div>';
}
/* ── 판·영역 손보기 ───────────────────────────────────────────────────
   판 지우기·영역 빼기는 **비어 있을 때만** 된다. 항목을 품은 채 사라지는 길은 두지 않는다. */
function editBoard(bid, fields, msg){
  var map = {};
  Object.keys(fields).forEach(function(f){ map['boards/' + bid + '/' + f] = fields[f]; });
  commit(map, msg);
}
function goBoard(bid){
  if (ui.open) closeSheet();
  ui.board = bid; ui.areaFilter = null;
  store.update({ 'meta/board': bid });
  render();
}
// ★시각으로 짓지 않는다 — Date.now().toString(36) 은 앞자리가 47초에 한 번 바뀐다.
//   앞 5자만 떼어 쓰다가 연달아 만든 판이 같은 id 로 태어나 앞 판을 덮었다(2026-09-10 브라우저 실측).
function newBoardId(d){
  var b = d.boards || {}, k;
  do { k = 'b' + Math.random().toString(36).slice(2, 6); } while (b.hasOwnProperty(k));
  return k;
}
function addBoard(){
  var d = store.load(), list = boardList(d);
  var bid = newBoardId(d);
  var map = {};
  map['boards/' + bid] = { name: '새 판', icon: '🗂️', order: (list.length ? (list[list.length - 1].order || list.length) : 0) + 1,
                           lastArea: 'a1', areas: { a1: { name: '일반', color: 'gray', order: 1 } } };
  map['meta/board'] = bid;
  commit(map, '판 만듦');
  ui.board = bid; ui.areaFilter = null; render();
  var pt = $('pagetitle'); if (pt && pt.focus) { pt.focus(); if (pt.select) pt.select(); }   // 바로 이름을 적게
  return bid;
}
function delBoard(){
  var d = store.load(), bid = curBoardId(d), list = boardList(d);
  if (list.length < 2) { toast('판이 하나뿐이다'); return false; }
  var n = taskCount(d, bid);
  if (n) { toast('항목 ' + n + '개가 남아 있다'); return false; }
  var next = list.filter(function(b){ return b.id !== bid; })[0].id;
  var map = {}; map['boards/' + bid] = null; map['meta/board'] = next;
  commit(map, '판 지움');
  ui.board = next; ui.areaFilter = null; render();
  return true;
}
function newAreaKey(d, bid){
  var a = ((d.boards || {})[bid] || {}).areas || {}, k;
  do { k = 'a' + Math.random().toString(36).slice(2, 5); } while (a.hasOwnProperty(k));
  return k;
}
function addArea(){
  var d = store.load(), bid = curBoardId(d); if (!bid) return null;
  var list = areaList(d, bid), key = newAreaKey(d, bid);
  var color = COLORS.filter(function(c){ return !list.some(function(a){ return a.color === c; }); })[0] || 'gray';
  var map = {};
  map['boards/' + bid + '/areas/' + key] = { name: '새 영역', color: color, order: (list.length ? (list[list.length - 1].order || list.length) : 0) + 1 };
  commit(map, '영역 만듦');
  ui.areaFilter = key; render();
  var pen = document.querySelector('[data-arearef="' + key + '"]');
  if (pen) openAreaEdit(pen, key);
  return key;
}
function renameArea(key, name){
  var d = store.load(), bid = curBoardId(d), a = areaDef(d, bid, key); if (!a) return;
  name = String(name || '').trim(); if (!name || name === a.name) return;
  commit((function(o){ o['boards/' + bid + '/areas/' + key + '/name'] = name; return o; })({}), '영역 이름');
}
function recolorArea(key, color){
  var d = store.load(), bid = curBoardId(d), a = areaDef(d, bid, key); if (!a || a.color === color) return;
  commit((function(o){ o['boards/' + bid + '/areas/' + key + '/color'] = color; return o; })({}), '영역 색');
}
function removeArea(key){
  var d = store.load(), bid = curBoardId(d), list = areaList(d, bid);
  if (list.length < 2) { toast('영역이 하나뿐이다'); return false; }
  var n = areaCount(d, bid, key);
  if (n) { toast('항목 ' + n + '개가 이 영역에 있다'); return false; }
  commit((function(o){ o['boards/' + bid + '/areas/' + key] = null; return o; })({}), '영역 뺌');
  if (ui.areaFilter === key) ui.areaFilter = null;
  render();
  return true;
}
function viewTable(d, today, match){
  var bid = curBoardId(d);
  var all = sortAll(d.tasks).filter(function(t){ return boardOf(t, d) === bid && t.ok !== false && (!ui.areaFilter || t.area === ui.areaFilter) && match(t); });
  var html = THEAD;
  STAT_GROUPS.forEach(function(g){
    var items = all.filter(function(t){ return t.status === g[0]; });
    if (g[0] === 'done') sortDone(items);
    if (!items.length) return;
    var closed = !!ui.fold[g[0]];
    html += ghHtml(g[1], items.length, g[0], closed);
    if (!closed) html += items.map(function(t){ return rowHtml(t, today); }).join('');
  });
  if (html === THEAD) html += '<li class="empty">비어 있다</li>';
  return areaChips() + '<ul id="list">' + html + '</ul>';
}
function viewBoard(d, today, match){
  var bid = curBoardId(d);
  var all = sortAll(d.tasks).filter(function(t){ return boardOf(t, d) === bid && t.ok !== false && (!ui.areaFilter || t.area === ui.areaFilter) && match(t); });
  var cols = STAT_GROUPS.map(function(g){
    var items = all.filter(function(t){ return t.status === g[0]; });
    if (g[0] === 'done') sortDone(items);
    return '<div class="bcol"><div class="bhead">' +
      '<span class="stat s-' + g[0] + '"><span class="dot s-' + g[0] + '"><i></i></span>' + g[1] + '</span>' +
      '<span class="cnt">' + items.length + '</span></div>' +
      items.map(function(t){
        var c = ckCount(t);
        return '<div class="card' + (isStale(t) ? ' stale' : '') + '" data-id="' + t.id + '" data-act="open">' +
          '<div class="ttl"><span class="emo">' + esc(t.icon || '') + '</span><span>' + esc(t.title) + '</span></div>' +
          '<div class="meta">' + dueCell(t, today) + areaTagOf(t) +
          (t.priority !== 2 ? tag(PRI_TAG[t.priority], PRI_KO[t.priority]) : '') +
          (c.y ? '<span class="id">☑' + c.x + '/' + c.y + '</span>' : '') + '</div></div>';
      }).join('') + '</div>';
  }).join('');
  return areaChips() + '<div class="board">' + cols + '</div>';
}
// 새 항목의 영역: 보드 = 이 판의 첫 영역. 전체 탭 = 켜진 영역 칩, 없으면 이 판에서 마지막에 쓴 영역
function curArea(){
  var d = store.load(), bid = curBoardId(d), b = (d.boards || {})[bid] || {}, list = areaList(d, bid);
  var first = list.length ? list[0].key : 'admin';
  if (ui.view !== 'all') return first;
  var pick = ui.areaFilter || b.lastArea;
  return (pick && areaDef(d, bid, pick)) ? pick : first;
}
function renderPreview(pr){
  var el = $('preview'); if (!pr) { el.innerHTML = ''; return; }
  var s = [];
  if (pr.editId) s.push(tag('purple', short(pr.editId) + ' 수정'));
  var p = pr.editId ? pr.patch : pr;
  if (pr.editId && p.status) s.push(tag('gray', STATUS_KO[p.status]));
  if (pr.editId ? 'due' in p : !!pr.due) s.push(tag('gray', p.due ? dueKo(p.due) : '마감 없음'));
  var ar = pr.editId ? p.area : pr.area;
  if (ar) { var pd = store.load(), pb = curBoardId(pd); s.push(tag(areaColor(pd, pb, ar), areaKo(pd, pb, ar))); }
  var pri = pr.editId ? p.priority : pr.priority;
  if (pri === 1 || pri === 3) s.push(tag(PRI_TAG[pri], PRI_KO[pri]));
  if (pr.checks.length) s.push(tag('green', '☑ ' + pr.checks.length));
  if (pr.memo) s.push(tag('gray', '메모'));
  el.innerHTML = s.join('');
}

/* ── 입력창 ── */
function submit(){
  var inp = $('in'), line = inp.value; if (!line.trim()) return;
  var d = store.load(), pr = parse(line, curArea(), todayStr(), d.tasks, curAreas());
  // 토큰만 치면 제목이 없다 — 「#교 !」 같은 항목이 생기지 않게 막는다
  if (pr.fallback) { toast('제목을 적어야 한다'); return; }
  if (pr.editId) { if (Object.keys(pr.patch).length) applyPatch(pr.editId, pr.patch); }

}
$('pagetitle').addEventListener('change', function(){

$('pagetitle').addEventListener('keydown', function(e){ if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); this.blur(); } });
$('in').addEventListener('input', render);
$('in').addEventListener('keydown', function(e){ if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); submit(); } });
$('go').addEventListener('click', submit);

/* ── 보기 바꾸기 · 본문 누르기 ── */
function goView(v){

  if (ui.view !== 'review' && isPC()) $('in').focus();   // 폰에서는 탭만 바꿔도 키보드가 올라오지 않게

$('main').addEventListener('click', function(e){
  var ed = e.target.closest('[data-edit]');

  if (ed) {
    var eh = ed.closest('[data-id]');

  }

});

/* ── 표에서 바로 고치기 (교사 지시 2026-09-09 — 시트를 열지 않고 칸에서 끝낸다) ── */
var EDIT_OPTS = {
  status: [['todo', '대기'], ['doing', '진행'], ['done', '완료']],

              'auth/network-request-failed': '네트워크에 닿지 않는다.' }[err.code] || err.code;
    $('lg-msg').textContent = m;
  })['finally'](function(){ b.disabled = false; $('lg-p').value = ''; });
});

if (!firebaseConfig || typeof firebase === 'undefined') { open_(); }
else sync.boot(function(u){ if (u) open_(); else askLogin(''); });
