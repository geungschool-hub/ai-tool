<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="할 일">
<title>할 일</title>
<style>
:root{
  --admin:#2f6fdb; --event:#d9489a; --class:#1f9d55;
  --todo:#b8bec8; --doing:#f59e0b; --done:#374151; --dropped:#9ca3af;
  --bg:#f6f7f9; --card:#fff; --ink:#111827; --mute:#6b7280; --line:#e2e5ea; --accent:#1f4fb8; --danger:#c62828;
  --nav-h:56px;
}
*{box-sizing:border-box}
#conn{font-size:16px;padding:2px 8px;border-radius:10px;background:#fde8e8;color:#a33;margin-left:auto;margin-right:8px;white-space:nowrap}
#conn.ok{display:none}
#login{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#login form{width:100%;max-width:320px;display:flex;flex-direction:column;gap:12px}
#login h2{margin:0 0 8px;font-size:22px}
#login input{height:48px;font-size:16px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
#login button{height:48px;font-size:16px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:600}
#login .msg{min-height:22px;font-size:16px;color:var(--danger)}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",Roboto,sans-serif;font-size:16px;line-height:1.35;
  display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button,.tap{min-height:44px;min-width:44px}
input,textarea,select{font:inherit;font-size:16px;color:inherit}
[hidden]{display:none!important}

header{order:0;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 16px;height:48px;background:var(--card);border-bottom:1px solid var(--line);flex:none}
header h1{font-size:18px;margin:0;font-weight:700}
header .cnt{color:var(--mute);font-weight:400;margin-left:8px;font-size:16px}
#gear{font-size:22px;color:var(--mute)}

main{order:1;flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:12px}
ul{list-style:none;margin:0;padding:0}
.gh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px;color:var(--mute);font-weight:700;font-size:16px}
.gh.fold{cursor:pointer;min-height:44px}
.gh.fold::after{content:"›";font-size:20px;transform:rotate(90deg);transition:transform .15s}
.gh.fold.closed::after{transform:rotate(0)}
.gh b{font-weight:400;margin-left:8px}

.row{display:flex;align-items:stretch;min-height:48px;background:var(--card);border-bottom:1px solid var(--line);border-left:5px solid var(--line)}
.row.a-admin{border-left-color:var(--admin)} .row.a-event{border-left-color:var(--event)} .row.a-class{border-left-color:var(--class)}
.row.stale .main{opacity:.45}
.row.s-done .t,.row.s-dropped .t{color:var(--mute);text-decoration:line-through}
.dot{flex:none;width:48px;display:flex;align-items:center;justify-content:center}
.dot i{display:block;width:20px;height:20px;border-radius:50%;border:2.5px solid var(--todo);font-style:normal;font-size:16px;line-height:15px;text-align:center;color:#fff;font-weight:700}
.dot.off{cursor:default;opacity:.4}
.row.s-todo .dot i{border-color:var(--todo)}
.row.s-doing .dot i{border-color:var(--doing);background:var(--doing)}
.row.s-done .dot i{border-color:var(--done);background:var(--done)}
.row.s-dropped .dot i{border-color:var(--dropped);background:var(--dropped)}
.row .main{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px 6px 0;text-align:left}
.row .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:17px}
.row .meta{flex:none;display:flex;gap:10px;color:var(--mute);font-size:16px;font-variant-numeric:tabular-nums}
.row .dn{font-weight:700;color:var(--ink)} .row .dn.over{color:var(--danger)} .row .dn.now{color:var(--accent)}
.row .id{font-family:ui-monospace,Menlo,Consolas,monospace;opacity:.7}

.chips{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:0 14px;border-radius:22px;background:var(--card);border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.a-admin.on{background:var(--admin);border-color:var(--admin)} .chip.a-event.on{background:var(--event);border-color:var(--event)} .chip.a-class.on{background:var(--class);border-color:var(--class)}
.chips-wrap{position:relative}
.chips-wrap.more::after{content:"";position:absolute;top:0;right:0;bottom:0;width:36px;background:linear-gradient(to right,rgba(255,255,255,0),var(--card) 70%);pointer-events:none}

#inbar{order:2;flex:none;background:var(--card);border-top:1px solid var(--line);padding:6px 0 0}
#preview{display:flex;gap:6px;padding:0 12px 6px;min-height:0;flex-wrap:wrap}
#preview:empty{display:none}
#preview span{min-height:28px;line-height:28px;padding:0 10px;border-radius:14px;background:var(--bg);border:1px solid var(--line);font-size:16px}
#preview span.a-admin{border-color:var(--admin);color:var(--admin)} #preview span.a-event{border-color:var(--event);color:var(--event)} #preview span.a-class{border-color:var(--class);color:var(--class)}
#preview span.hi{border-color:var(--danger);color:var(--danger)} #preview span.lo{color:var(--mute)}
#preview span.ed{background:var(--ink);color:#fff;border-color:var(--ink)}
.inrow{display:flex;gap:6px;padding:0 12px 8px}
#in{flex:1;min-width:0;height:44px;padding:0 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);outline:none}
#in:focus{border-color:var(--accent);background:#fff}
#go{width:44px;border-radius:12px;background:var(--accent);color:#fff;font-size:20px}
#inbar .chips{padding-top:0;padding-bottom:8px}
#inbar .chip{min-width:44px;padding:0 10px}
#inbar .sep{flex:none;width:1px;margin:8px 2px;background:var(--line)}
#pick{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

nav{order:3;flex:none;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;height:var(--nav-h);color:var(--mute);font-weight:700;font-size:16px;border-top:3px solid transparent}
nav button.on{color:var(--accent);border-top-color:var(--accent)}

.empty{padding:48px 16px;text-align:center;color:var(--mute)}
#review{padding:24px 16px}
#reqbtn{width:100%;height:52px;border-radius:14px;border:1.5px solid var(--accent);color:var(--accent);font-weight:700;font-size:17px}
#reqbtn.on{background:var(--accent);color:#fff}

/* 상세 시트 */
.sheet{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.35)}
.sheet-body{position:relative;background:var(--card);border-radius:18px 18px 0 0;max-height:92dvh;overflow-y:auto;padding:8px 16px 24px;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.sh-top{display:flex;gap:6px;align-items:center;position:sticky;top:0;background:var(--card);padding:6px 0 8px;z-index:1}
.sh-top input{flex:1;min-width:0;height:44px;border:0;border-bottom:2px solid var(--line);font-size:19px;font-weight:700;outline:none;background:none;padding:0 4px}
.sh-top input:focus{border-bottom-color:var(--accent)}
.sh-top .id{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--mute)}
.seg{display:flex;gap:6px;margin:10px 0}
.seg button{flex:1;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--mute);font-weight:600;padding:0 6px;white-space:nowrap}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.seg button.a-admin.on{background:var(--admin);border-color:var(--admin)} .seg button.a-event.on{background:var(--event);border-color:var(--event)} .seg button.a-class.on{background:var(--class);border-color:var(--class)}
.seg button.p1.on{background:var(--danger);border-color:var(--danger)}
.seg button.s-doing.on{background:var(--doing);border-color:var(--doing)}
.seg.push button{background:var(--card)}
.lbl{color:var(--mute);font-size:16px;margin:14px 0 4px;font-weight:700}
.duerow{display:flex;gap:6px;align-items:center}
.duerow input[type=date]{flex:1;height:44px;border:1.5px solid var(--line);border-radius:10px;padding:0 10px;background:var(--bg)}
.duerow button{border:1.5px solid var(--line);border-radius:10px;padding:0 12px;color:var(--mute)}
.ck{display:flex;align-items:center;min-height:44px;border-bottom:1px solid var(--line)}
.ck button.tg{flex:1;display:flex;align-items:center;gap:10px;text-align:left;padding:0 4px}
.ck button.tg i{flex:none;width:22px;height:22px;border:2px solid var(--todo);border-radius:6px;font-style:normal;text-align:center;line-height:18px;color:#fff;font-weight:700}
.ck.done button.tg i{background:var(--class);border-color:var(--class)}
.ck.done button.tg span{color:var(--mute);text-decoration:line-through}
.ck button.rm{width:44px;color:var(--mute)}
.ckadd{display:flex;gap:6px;margin-top:6px}
.ckadd input{flex:1;min-width:0;height:44px;border:1.5px dashed var(--line);border-radius:10px;padding:0 12px;background:none;outline:none}
.ckadd input:focus{border-style:solid;border-color:var(--accent)}
.sheet textarea,.sheet input.ref{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);outline:none;resize:vertical;min-height:44px}
.sheet textarea:focus,.sheet input.ref:focus{border-color:var(--accent);background:#fff}
details summary{min-height:44px;display:flex;align-items:center;color:var(--mute);font-weight:700;cursor:pointer;list-style:none}
details summary::before{content:"›";display:inline-block;width:20px;font-size:20px;transition:transform .15s}
details[open] summary::before{transform:rotate(90deg)}
.log li{display:flex;gap:12px;min-height:32px;align-items:center;color:var(--mute);font-size:16px;font-variant-numeric:tabular-nums}
.log li span:first-child{flex:none;width:88px}
.log li span:last-child{color:var(--ink)}
.danger{display:flex;gap:6px;margin-top:20px}
.danger button{flex:1;border:1.5px solid var(--line);border-radius:10px;color:var(--danger)}
.danger button.restore{color:var(--class)}

/* 설정 */
.modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:16px}
.modal-body{background:var(--card);border-radius:16px;padding:16px;width:100%;max-width:420px}
.modal-body h2{font-size:18px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.modal-body h2 button{color:var(--mute);font-size:22px}
.stack{display:flex;flex-direction:column;gap:8px}
.stack button.wide{border:1.5px solid var(--line);border-radius:10px;height:48px;font-weight:600}
.exam{display:flex;gap:6px;align-items:center}
.exam input{flex:1;min-width:0;height:44px;border:1.5px solid var(--line);border-radius:10px;padding:0 8px;background:var(--bg)}
.stamp{color:var(--mute);text-align:right;margin-top:12px;font-family:ui-monospace,Menlo,Consolas,monospace}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:40;background:var(--ink);color:#fff;border-radius:12px;padding:0 6px 0 16px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100% - 24px)}
#toast button{color:#ffd166;font-weight:700;padding:0 10px}

@media (min-width:768px){
  body{max-width:720px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}
  header{order:0} nav{order:1;border-top:0;border-bottom:1px solid var(--line)} #inbar{order:2;border-top:0;border-bottom:1px solid var(--line)} main{order:3}
  nav button{height:48px}
  .sheet{align-items:center;justify-content:center}
  .sheet-body{width:100%;max-width:560px;border-radius:18px;max-height:88vh}
}
</style>
</head>
<body>

<header>
  <h1>할 일<span class="cnt" id="cnt"></span></h1>
  <span id="conn" hidden></span>
  <button id="gear" aria-label="설정">⚙</button>
</header>

<nav>
  <button data-tab="today" class="on">오늘</button>
  <button data-tab="all">전체</button>
  <button data-tab="review">검토</button>
</nav>

<div id="inbar">
  <div id="preview"></div>
  <div class="inrow">
    <input id="in" type="text" autocomplete="off" autocapitalize="off" enterkeyhint="done" spellcheck="false">
    <button id="go" aria-label="저장">↵</button>
    <input id="pick" type="date" tabindex="-1" aria-hidden="true">
  </div>
  <div class="chips-wrap" id="tokwrap">
  <div class="chips" id="tokchips">
    <button class="chip" data-tok="@오늘">오늘</button>
    <button class="chip" data-tok="@내일">내일</button>
    <button class="chip" data-tok="@이번주">이번주</button>
    <button class="chip" data-tok="@다음주">다음주</button>
    <button class="chip" data-tok="pick">📅</button>
    <span class="sep"></span>
    <button class="chip a-admin" data-tok="#행">행</button>
    <button class="chip a-event" data-tok="#사">사</button>
    <button class="chip a-class" data-tok="#교">교</button>
    <span class="sep"></span>
    <button class="chip" data-tok="!">!</button>
  </div>
  </div>
</div>

<main>
  <div id="areachips" class="chips" hidden>
    <button class="chip a-admin" data-area="admin">행정</button>
    <button class="chip a-event" data-area="event">행사</button>
    <button class="chip a-class" data-area="class">교과</button>
  </div>
  <ul id="list"></ul>
  <div id="review" hidden><button id="reqbtn">검토 요청</button></div>
</main>

<div id="sheet" class="sheet" hidden></div>
<div id="settings" class="modal" hidden></div>
<div id="login" hidden>
  <form id="loginform">
    <h2>할 일</h2>
    <label class="lbl" for="lg-e">이메일</label>
    <input id="lg-e" type="email" autocomplete="username" required>
    <label class="lbl" for="lg-p">비밀번호</label>
    <input id="lg-p" type="password" autocomplete="current-password" required>
    <button type="submit">들어가기</button>
    <div class="msg" id="lg-msg"></div>
  </form>
</div>
<div id="toast" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>

<script>

function dParse(s){ var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) : NaN; }

  if (!tasks) return [];

  return Object.keys(tasks).map(function(k){ var t = Object.assign({}, tasks[k]); t.id = k; return t; });
}
function findTaskId(tasks, tok){
  tok = String(tok).toLowerCase();
  var hit = taskList(tasks).filter(function(t){ return t.id === tok || (tok.length === 3 && t.id.slice(-3) === tok); });
  if (hit.length > 1) { var live = hit.filter(function(t){ return !t.deletedAt; }); if (live.length) hit = live; }
  return hit.length ? hit[0].id : null;

// parse(line, defaultArea, today, tasks) — 순수. 토큰은 앞에 공백(또는 줄 머리)이 있을 때만. 실패 없음.
function parse(line, defaultArea, today, tasks){
  line = String(line == null ? '' : line);
  var head = line, memo;
  var mi = line.search(/(^|\s)\/\//);
  if (mi >= 0) { var cut = line.indexOf('//', mi); memo = line.slice(cut + 2).trim() || undefined; head = line.slice(0, mi); }
  var words = head.split(/\s+/).filter(Boolean);
  var titleW = [], checks = [], sink = titleW;

// RTDB 연결 · 로그인. STORE 는 이 블록이 없어도(M1·검사) 그대로 돈다.
var sync = (function(){
  var st = { on: false, at: null, uid: null, email: null, ready: false, err: null };
  var db = null, ref = null;
  function fmtT(ms){ var d = new Date(ms); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  function paint(){
    var b = document.getElementById('conn'); if (!b) return;
    b.hidden = !st.uid;
    b.className = st.on ? 'ok' : 'off';
    b.textContent = st.on ? '' : '읽기 전용';   // 마지막 동기화 시각은 설정에
  }
  function start(user){
    st.uid = user.uid; st.email = user.email;
    tmSync = { write: function(map){
      var out = {}; Object.keys(map).forEach(function(k){ var v = map[k]; out[k] = v === undefined ? null : v; });

    ref.on('value', function(s){ st.at = Date.now(); tmHooks.fromRemote(s.val() || {}); paint(); },

  }

  else if (tok.charAt(0) === '#') { v = v.replace(/(^|\s)#(행정|행사|행|사|교과|교)(?=\s|$)/g, '') + ' ' + tok; }
  else { v = v.replace(/(^|\s)@(오늘|내일|모레|이번주|다음주|담주[월화수목금토일]|[월화수목금토일]|없음|\+\d+|[\d\/.\-]+)(?=\s|$)/g, '') + ' ' + tok; }
  inp.value = v.replace(/^\s+/, '') + ' ';
  render(); inp.focus();
}
function chipFade(){ var w = $('tokwrap'), c = $('tokchips'); w.classList.toggle('more', c.scrollLeft + c.clientWidth < c.scrollWidth - 2); }
$('in').addEventListener('input', render);
$('in').addEventListener('keydown', function(e){ if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); submit(); } });
$('go').addEventListener('click', submit);
$('tokchips').addEventListener('click', function(e){
  var b = e.target.closest('[data-tok]'); if (!b) return;
  if (b.dataset.tok === 'pick') { var p = $('pick'); p.value = ''; if (p.showPicker) { try { p.showPicker(); return; } catch (x) {} } p.click(); return; }
  insertToken(b.dataset.tok);
});
$('tokchips').addEventListener('scroll', chipFade);
$('pick').addEventListener('change', function(){ if (this.value) insertToken('@' + this.value); });   // 연도까지 그대로

/* 탭 · 목록 */
document.querySelector('nav').addEventListener('click', function(e){
  var b = e.target.closest('[data-tab]'); if (!b) return;
  ui.tab = b.dataset.tab; render();
  if (ui.tab !== 'review' && isPC()) $('in').focus();   // 폰에서는 탭만 바꿔도 키보드가 올라오지 않게
});
$('areachips').addEventListener('click', function(e){
  var b = e.target.closest('[data-area]'); if (!b) return;
  ui.areaFilter = ui.areaFilter === b.dataset.area ? null : b.dataset.area; render();
});
$('list').addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if (!b) return;
  var act = b.dataset.act;
  if (act === 'fold') { ui.fold[b.dataset.g] = !ui.fold[b.dataset.g]; render(); return; }
  var id = b.closest('[data-id]').dataset.id;
  if (act === 'cycle') cycleStatus(id);
  else if (act === 'open') { ui.open = id; renderSheet(); }
});
$('reqbtn').addEventListener('click', function(){
  var d = store.load(); store.update({ 'meta/reviewReq': !d.meta.reviewReq }); render();
});

/* 상세 시트 */
function nextMondayAfter(ymd){ return addDays(ymd, ((1 - dow(ymd) + 7) % 7) || 7); }
function pushDates(today, exam){
  var tmr = addDays(today, 1), fri = nextDow(today, 5), friL = '이번 주 금';
  if (fri <= tmr) { fri = addDays(fri, 7); friL = '다음 주 금'; }   // 목·금엔 「이번 주 금」이 내일·오늘이라 다음 주 금으로
  var p = [['내일', tmr], [friL, fri], ['다음 주 월', nextMonday(today)]];
  if (exam && exam.end) p.push(['시험 뒤', nextMondayAfter(exam.end)]);
  p.sort(function(a, b){ return a[1] < b[1] ? -1 : a[1] > b[1] ? 1 : 0; });
  var seen = {};
  return p.filter(function(x){ if (seen[x[1]]) return false; seen[x[1]] = 1; return true; });   // 같은 날짜는 하나만
}
// 기록 한 줄 — 내부 필드 경로 대신 사람이 읽는 말로. null 이면 안 보여 준다
function logLine(t, l){
  var f = l.field, m = /^checks\/([^/]+)(?:\/(\w+))?$/.exec(f);
  if (m) {
    var c = (t.checks || {})[m[1]], txt = c ? c.text : '';
    if (!m[2]) return (l.to == null ? '− ' : '+ ') + (txt || l.to || l.from || '');
    if (m[2] !== 'done') return null;
    return '☑ ' + (txt || '') + ' ' + (l.to ? '✓' : '○');
  }
  if (f === 'create') return '생성';
  if (f === 'deletedAt') return l.to == null ? '되살림' : '휴지통';
  var kv = function(v){ if (v == null) return '—'; if (f === 'status') return STATUS_KO[v] || v; if (f === 'area') return AREA_KO[v] || v; if (f === 'priority') return PRI_KO[v] || v; return String(v); };
  return (FIELD_KO[f] || f) + ' ' + kv(l.from) + ' → ' + kv(l.to);
}
function renderSheet(){
  var d = store.load(), sh = $('sheet');
  if (!d.tasks[ui.open]) { ui.open = null; sh.hidden = true; sh.innerHTML = ''; return; }
  var act = document.activeElement;
  if (act && !sh.hidden && sh.contains(act) && /^sh-(title|memo|ref)$/.test(act.id || '')) return;   // 적는 중엔 다시 그리지 않는다
  var body = sh.querySelector('.sheet-body'), st = body ? body.scrollTop : 0, opened = !sh.hidden && !!sh.querySelector('details[open]');
  var t = Object.assign({ id: ui.open }, d.tasks[ui.open]);   // 저장 객체엔 id 필드가 없다 — 키가 id
  var today = todayStr(), exam = d.meta.exam || {};
  var seg = function(f, opts, cls){ return '<div class="seg">' + opts.map(function(o){ return '<button data-set="' + f + '" data-v="' + o[0] + '" class="' + (cls ? cls(o[0]) : '') + (String(t[f]) === String(o[0]) ? ' on' : '') + '">' + o[1] + '</button>'; }).join('') + '</div>'; };
  var push = pushDates(today, exam);
  var logs = Object.keys(d.log).map(function(k){ return d.log[k]; }).filter(function(l){ return l.task === t.id; }).sort(function(a, b){ return b.ts - a.ts; })
    .map(function(l){ return { ts: l.ts, text: logLine(t, l) }; }).filter(function(l){ return l.text; }).slice(0, 10);
  var fmtTs = function(ms){ var x = new Date(ms); return (x.getMonth() + 1) + '/' + x.getDate() + ' ' + pad2(x.getHours()) + ':' + pad2(x.getMinutes()); };
  sh.innerHTML = '<div class="sheet-bg" data-act="close"></div><div class="sheet-body">' +
    '<div class="sh-top"><input id="sh-title" value="' + esc(t.title) + '"><span class="id">' + short(t.id) + '</span><button data-act="close" aria-label="닫기">✕</button></div>' +
    seg('status', [['todo', '대기'], ['doing', '진행'], ['done', '완료'], ['dropped', '버림']], function(v){ return 's-' + v; }) +
    seg('area', [['admin', '행정'], ['event', '행사'], ['class', '교과']], function(v){ return 'a-' + v; }) +
    seg('priority', [[1, '높음'], [2, '보통'], [3, '낮음']], function(v){ return 'p' + v; }) +
    '<div class="lbl">마감</div><div class="duerow"><input type="date" id="sh-due" value="' + (t.due || '') + '">' + (t.due ? '<button data-set="due" data-v="">없음</button>' : '') + '</div>' +
    '<div class="seg push">' + push.map(function(p){ return '<button data-set="due" data-v="' + p[1] + '">' + p[0] + '</button>'; }).join('') + '</div>' +
    '<div class="lbl">체크</div>' + ckList(t).map(function(c){
      return '<div class="ck' + (c.done ? ' done' : '') + '"><button class="tg" data-ck="' + c.id + '"><i>' + (c.done ? '✓' : '') + '</i><span>' + esc(c.text) + (c.by === 'claude' ? ' 🤖' : '') + '</span></button><button class="rm" data-ckrm="' + c.id + '" aria-label="삭제">✕</button></div>';
    }).join('') +
    '<div class="ckadd"><input id="sh-ck" placeholder="+"></div>' +
    '<div class="lbl">메모</div><textarea id="sh-memo" rows="2">' + esc(t.memo || '') + '</textarea>' +
    '<div class="lbl">ref</div><input class="ref" id="sh-ref" value="' + esc(t.ref || '') + '">' +
    (logs.length ? '<details' + (opened ? ' open' : '') + '><summary>기록</summary><ul class="log">' + logs.map(function(l){ return '<li><span>' + fmtTs(l.ts) + '</span><span>' + esc(l.text) + '</span></li>'; }).join('') + '</ul></details>' : '') +
    '<div class="danger">' + (t.deletedAt ? '<button class="restore" data-act="restore">되살리기</button>' : '<button data-set="status" data-v="dropped">버리기</button><button data-act="trash">휴지통</button>') + '</div>' +
    '</div>';
  sh.hidden = false;
  body = sh.querySelector('.sheet-body'); if (body && st) body.scrollTop = st;
}
function closeSheet(){
  ui.open = null; $('sheet').hidden = true; $('sheet').innerHTML = '';
  if (ui.tab !== 'review' && (isPC() || $('in').value)) $('in').focus();
}
$('sheet').addEventListener('click', function(e){
  var id = ui.open, b = e.target.closest('button,[data-act]'); if (!b || !id) return;
  if (b.dataset.act === 'close') { closeSheet(); return; }
  if (b.dataset.act === 'trash') { editTask(id, { deletedAt: Date.now() }, '휴지통 ' + short(id)); closeSheet(); render(); return; }
  if (b.dataset.act === 'restore') { editTask(id, { deletedAt: null }, '되살림 ' + short(id)); render(); return; }
  if (b.dataset.set) {
    var f = b.dataset.set, v = b.dataset.v;
    if (f === 'priority') v = +v;
    if (f === 'due' && !v) v = null;
    editTask(id, (function(o){ o[f] = v; return o; })({}), false); render(); return;
  }
  if (b.dataset.ck) {
    var t = store.load().tasks[id], c = t.checks[b.dataset.ck], done = !c.done;
    var o = {}; o['checks/' + b.dataset.ck + '/done'] = done; o['checks/' + b.dataset.ck + '/by'] = done ? 'me' : null; o['checks/' + b.dataset.ck + '/ts'] = done ? Date.now() : null;
    editTask(id, o, false); render(); return;
  }
  if (b.dataset.ckrm) { var o2 = {}; o2['checks/' + b.dataset.ckrm] = null; editTask(id, o2, '체크 삭제'); render(); return; }
});
$('sheet').addEventListener('change', function(e){
  var id = ui.open, el = e.target; if (!id) return;
  if (el.id === 'sh-title') { var v = el.value.trim(); if (v) editTask(id, { title: v }, false); render(); }
  else if (el.id === 'sh-due') { editTask(id, { due: el.value || null }, false); render(); }
  else if (el.id === 'sh-memo') { editTask(id, { memo: el.value.trim() || null }, false); render(); }
  else if (el.id === 'sh-ref') { editTask(id, { ref: el.value.trim() || null }, false); render(); }
});
$('sheet').addEventListener('keydown', function(e){
  if (e.key !== 'Enter' || e.isComposing) return;
  var el = e.target;
  if (el.id === 'sh-ck') { e.preventDefault(); var v = el.value.trim(); if (!v) return; var map = {}; addChecks(ui.open, [v], map, Date.now()); commit(map, false); render(); $('sh-ck').focus(); }
  else if (el.id === 'sh-title') { e.preventDefault(); el.blur(); }
});

/* 설정 */
function openSettings(){
  var d = store.load(), ex = d.meta.exam || {};
  $('settings').innerHTML = '<div class="modal-body"><h2>설정<button data-act="close" aria-label="닫기">✕</button></h2><div class="stack">' +
    '<button class="wide" data-act="json">JSON 복사</button><button class="wide" data-act="md">MD 복사</button>' +
    '<div class="lbl">시험 기간</div><div class="exam"><input type="date" id="ex-s" value="' + (ex.start || '') + '"> ~ <input type="date" id="ex-e" value="' + (ex.end || '') + '"></div>' +
    (sync.state.uid ? '<div class="lbl">계정</div><div class="acct">' + esc(sync.state.email || '') + '</div>' +
      '<button class="wide" data-act="logout">로그아웃</button>' : '') +
    '</div><div class="stamp">' + esc(BUILD) + (sync.state.at ? ' · 동기화 ' + sync.fmtT(sync.state.at) : '') + '</div></div>';
  $('settings').hidden = false;
}
$('gear').addEventListener('click', openSettings);
$('settings').addEventListener('click', function(e){
  if (e.target === $('settings')) { $('settings').hidden = true; return; }
  var b = e.target.closest('[data-act]'); if (!b) return;
  if (b.dataset.act === 'close') $('settings').hidden = true;
  else if (b.dataset.act === 'json') copyText(JSON.stringify(store.load(), null, 2));
  else if (b.dataset.act === 'md') copyText(toMarkdown(store.load()));
  else if (b.dataset.act === 'logout') sync.signOut();
});
$('settings').addEventListener('change', function(e){
  if (e.target.id !== 'ex-s' && e.target.id !== 'ex-e') return;
  store.update({ 'meta/exam': { start: $('ex-s').value || null, end: $('ex-e').value || null } });
});
function toMarkdown(d){
  var rows = sortAll(d.tasks).filter(isListed);
  var line = function(t){ var c = ckCount(t); return '| ' + short(t.id) + ' | ' + STATUS_KO[t.status] + ' | ' + AREA_KO[t.area] + ' | ' + PRI_KO[t.priority] + ' | ' + (t.due || '') + ' | ' + t.title.replace(/\|/g, '\\|') + ' | ' + (c.y ? c.x + '/' + c.y : '') + ' | ' + (t.memo || '').replace(/\|/g, '\\|').replace(/\n/g, ' ') + ' |'; };
  var head = '| id | 상태 | 영역 | 중요도 | 마감 | 제목 | 체크 | 메모 |\n|---|---|---|---|---|---|---|---|\n';
  var open = rows.filter(function(t){ return t.status === 'todo' || t.status === 'doing'; });
  var done = rows.filter(function(t){ return t.status === 'done'; });
  return '## 열린 항목 (' + open.length + ')\n\n' + head + open.map(line).join('\n') + '\n\n## 완료 항목 (' + done.length + ')\n\n' + head + done.map(line).join('\n') + '\n';
}
function copyText(s){
  var done = function(){ toast('복사됨'); };
  if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(s).then(done, function(){ fallbackCopy(s); done(); }); }
  else { fallbackCopy(s); done(); }
}
function fallbackCopy(s){ var ta = document.createElement('textarea'); ta.value = s; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) {} document.body.removeChild(ta); }

/* 토스트 — 폰에선 입력창(미리보기 칩 포함) 실제 높이 위에 띄운다 */
function placeToast(){
  var el = $('toast'); if (el.hidden) return;
  if (isPC() || $('inbar').hidden) { el.style.bottom = ''; return; }
  el.style.bottom = (($('inbar').offsetHeight || 0) + (document.querySelector('nav').offsetHeight || 0) + 16) + 'px';
}
function toast(msg, undo){
  var el = $('toast');
  el.innerHTML = '<span>' + esc(msg) + '</span>' + (undo ? '<button id="undo">되돌리기</button>' : '<span style="width:6px"></span>');
  el.hidden = false;
  placeToast();
  if (undo) $('undo').addEventListener('click', function(){ undo(); el.hidden = true; render(); });
  clearTimeout(undoTimer);
  undoTimer = setTimeout(function(){ el.hidden = true; }, undo ? 5000 : 1500);   // 되돌리기 5초
}

store.subscribe(function(){ render(); });
window.addEventListener('resize', chipFade);

/* 로그인 뒤에 그린다. firebaseConfig 가 없으면(M1 판) 예전처럼 바로 연다. */
function open_(){ $('login').hidden = true; render(); chipFade(); sync.paint(); $('in').focus(); }
function askLogin(msg){
  $('login').hidden = false; $('lg-msg').textContent = msg || '';
  $('list').innerHTML = ''; $('cnt').textContent = '';
}
$('loginform').addEventListener('submit', function(e){
  e.preventDefault();
  var b = this.querySelector('button'); b.disabled = true; $('lg-msg').textContent = '';
  sync.signIn($('lg-e').value.trim(), $('lg-p').value)['catch'](function(err){
    var m = { 'auth/invalid-credential': '이메일이나 비밀번호가 맞지 않는다.',
              'auth/invalid-email': '이메일 꼴이 아니다.',
              'auth/user-disabled': '사용 중지된 계정이다.',
              'auth/too-many-requests': '시도가 많아 잠겼다. 잠시 뒤 다시.',
              'auth/network-request-failed': '네트워크에 닿지 않는다.' }[err.code] || err.code;
    $('lg-msg').textContent = m;
  })['finally'](function(){ b.disabled = false; $('lg-p').value = ''; });
});

if (!firebaseConfig || typeof firebase === 'undefined') { open_(); }
else sync.boot(function(u){ if (u) open_(); else askLogin(''); });
</script>
