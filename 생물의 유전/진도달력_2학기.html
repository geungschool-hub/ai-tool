<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>생물의 유전 — 2학기 진도달력 (2026)</title>
<style>
:root{
  --blue-pastel:#C5E3F7; --green-pastel:#C3E9CC;
  --blue-dark:#1255A0; --green-dark:#2A7A38;
  --red-accent:#C0392B; --amber:#E67E22;
  --text-main:#1A1A1A; --text-light:#555; --line:#BBBBBB;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:'Malgun Gothic','Noto Sans KR',sans-serif; background:#f0f2f5; color:var(--text-main); padding:16px;}
.wrap{max-width:1280px; margin:0 auto;}

/* ── 상단 바 ── */
.topbar{background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px 18px; margin-bottom:12px;
  display:flex; flex-wrap:wrap; gap:12px; align-items:center;}
.topbar h1{font-size:19px; color:var(--blue-dark);}
.topbar .sub{font-size:12px; color:var(--text-light);}
.spacer{flex:1;}
button{border:1px solid var(--line); background:#fff; border-radius:8px; padding:9px 14px; font-size:13px;
  cursor:pointer; min-height:44px;}
button:hover{background:#f2f7fc; border-color:var(--blue-dark); color:var(--blue-dark);}
button.danger:hover{border-color:var(--red-accent); color:var(--red-accent); background:#fdf1ef;}

/* 시수 요약 */
.sumbox{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
.sumchip{border-radius:8px; padding:6px 10px; font-size:12.5px; border:1.5px solid;}
.sumchip b{font-size:13.5px;}
.sumchip.B{border-color:var(--blue-dark); color:var(--blue-dark); background:#eef5fc;}
.sumchip.C{border-color:var(--green-dark); color:var(--green-dark); background:#f0faf2;}
.sumchip.D{border-color:var(--amber); color:#b05e10; background:#fdf3e7;}
.sumnote{font-size:11px; color:var(--text-light);}

/* ── 범례 ── */
.legend{display:flex; flex-wrap:wrap; gap:10px; font-size:11.5px; color:var(--text-light);
  margin:0 2px 10px; align-items:center;}
.legend .bdg{transform:none;}

/* ── 달력 표 ── */
table{width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); table-layout:fixed;}
th{background:var(--blue-pastel); border:1px solid var(--line); padding:7px 4px; font-size:13px; color:var(--blue-dark);}
th.wk{width:112px;} th.plan{width:210px;}
td{border:1px solid var(--line); vertical-align:top; font-size:12px;}
tr.month-row td{background:var(--blue-dark); color:#fff; font-weight:700; font-size:13px; padding:5px 10px; letter-spacing:2px;}

/* 주차 칸 */
td.wk{background:#FAFAFA; padding:7px 6px; text-align:center;}
td.wk .wno{font-weight:700; font-size:13.5px; color:var(--blue-dark);}
td.wk .wrange{font-size:10.5px; color:var(--text-light); margin:2px 0 6px;}
td.wk .whrs{display:flex; gap:3px; justify-content:center; flex-wrap:wrap;}
td.wk .whrs span{font-size:10.5px; border-radius:4px; padding:1px 5px; border:1px solid;}
td.wk .whrs .hB{color:var(--blue-dark); border-color:var(--blue-dark);}
td.wk .whrs .hC{color:var(--green-dark); border-color:var(--green-dark);}
td.wk .whrs .hD{color:#b05e10; border-color:var(--amber);}
td.wk .whrs .h0{opacity:.35;}

/* 진도 칸 */
td.plan{padding:0; background:#fffdf5;}
/* 날짜 칸 */
td.day{padding:0; height:96px;}
td.day.off{background:#f5f5f5;}
.daytop{display:flex; align-items:center; gap:4px; padding:4px 6px 2px; flex-wrap:wrap;}
.dnum{font-weight:700; font-size:12.5px; color:var(--text-main);}
.off .dnum{color:#999;}
.dnum.sun{color:var(--red-accent);}

/* 배지 */
.bdg{font-size:10px; border-radius:4px; padding:1px 5px; font-weight:700; white-space:nowrap;}
.bdg.holiday{background:#fdecea; color:var(--red-accent);}
.bdg.exam{background:var(--blue-dark); color:#fff;}
.bdg.event{background:#fdf3e7; color:#b05e10;}
.bdg.swap{background:#e5f4f2; color:#276e68; border:1px dashed #276e68;}
.bdg.warn{background:var(--red-accent); color:#fff;}
.bdg.info{background:#eee; color:#777;}

/* 수업 칩 (클릭 토글) */
.chips{display:flex; gap:3px; padding:0 6px 2px; flex-wrap:wrap;}
.chip{font-size:10.5px; border-radius:5px; padding:2px 6px; font-weight:700; cursor:pointer;
  border:1.5px solid; user-select:none; line-height:1.5;}
.chip.B{background:#eef5fc; border-color:var(--blue-dark); color:var(--blue-dark);}
.chip.C{background:#f0faf2; border-color:var(--green-dark); color:var(--green-dark);}
.chip.D{background:#fdf3e7; border-color:var(--amber); color:#b05e10;}
.chip.offchip{background:#f1f1f1 !important; border-color:#ccc !important; color:#aaa !important;
  text-decoration:line-through; font-weight:400;}

/* 편집 영역 */
.ed{padding:5px 7px; min-height:20px; outline:none; line-height:1.5; word-break:break-all;
  white-space:pre-wrap; cursor:text;}
td.plan .ed{min-height:88px; font-size:12px;}
td.day .ed{font-size:11px; color:#333;}
.ed:focus{background:#fffbe6; box-shadow:inset 0 0 0 2px var(--amber);}
.ed:empty::before{content:attr(data-ph); color:#c9c9c9; font-size:10.5px;}
.edited{position:relative;}
.edited::after{content:''; position:absolute; top:3px; right:3px; width:7px; height:7px;
  border-radius:50%; background:var(--amber);}
td.plan, td.day{position:relative;}
.rstbtn{display:none; position:absolute; bottom:2px; right:2px; font-size:10px; min-height:0;
  padding:1px 5px; border-radius:4px; background:#fff; color:var(--text-light);}
.edited:hover .rstbtn{display:block;}

@media print{
  body{background:#fff; padding:0;}
  .topbar button, .legend, .rstbtn{display:none !important;}
  .topbar{border:none; padding:4px 0; margin-bottom:6px;}
  td.day{height:auto; min-height:70px;}
  .edited::after{display:none;}
  table{font-size:10px;}
  tr{page-break-inside:avoid;}
  @page{size:A4 landscape; margin:8mm;}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <h1>🧬 생물의 유전 — 2학기 진도달력 <span style="font-weight:400;font-size:14px;">(2026)</span></h1>
      <div class="sub">중간 9/30~10/7 (범위: <b>Ⅰ단원 p.12~53</b>) · 기말 12/7~11 (범위: <b>Ⅱ단원 + Ⅲ단원</b>) · 진도·메모 칸은 클릭해서 바로 수정 (자동 저장) · 수업 칩은 클릭하면 결손/복구 토글</div>
    </div>
    <div class="spacer"></div>
    <div class="sumbox" id="sumbox"></div>
    <button onclick="doExport()">💾 내보내기</button>
    <button onclick="fileIn.click()">📂 가져오기</button>
    <button onclick="window.print()">🖨 인쇄</button>
    <button class="danger" onclick="resetAll()">↺ 기본계획 복원</button>
    <input type="file" id="fileIn" accept=".json" style="display:none" onchange="doImport(this)">
  </div>

  <div class="legend">
    <span class="bdg holiday">휴일</span><span class="bdg exam">고사·평가</span>
    <span class="bdg event">행사</span><span class="bdg swap">금요일 시간표</span>
    <span class="bdg warn">수행평가 불가</span>
    <span>│ 수업 칩: <span class="chip B" style="cursor:default">B 5·6</span> 월5·6+금2 ·
    <span class="chip C" style="cursor:default">C 5</span> 목5+금3·4 ·
    <span class="chip D" style="cursor:default">D 3·4</span> 화3·4+수5</span>
    <span>│ 주황 점 = 기본계획에서 수정된 칸</span>
  </div>

  <table id="cal">
    <thead><tr>
      <th class="wk">주차 / 시수</th><th class="plan">주 진도 (수정 가능)</th>
      <th>월</th><th>화</th><th>수</th><th>목</th><th>금</th>
    </tr></thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

const TERMS = [
  {name:'중간 전', from:'2026-08-10', to:'2026-09-29'},
  {name:'중간~기말', from:'2026-10-08', to:'2026-12-04'},
  {name:'기말 후', from:'2026-12-14', to:'2026-12-31'}
];

/* ═══════════ ② 저장/상태 ═══════════ */
const LS_KEY = 'genePace2026';
let store = {weeks:{}, days:{}, chips:{}};
try{ const s = localStorage.getItem(LS_KEY); if(s) store = Object.assign({weeks:{},days:{},chips:{}}, JSON.parse(s)); }catch(e){}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(store)); }catch(e){} }

/* ═══════════ ③ 달력 유틸 ═══════════ */
function d2s(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function s2d(s){ const p=s.split('-'); return new Date(+p[0], p[1]-1, +p[2]); }
function effDow(key, d){ return FRIDAY_SWAP.includes(key) ? 5 : d.getDay(); }
function dayEvents(key){ return EVENTS[key] || []; }
function isNoClass(key){ return dayEvents(key).some(e=>e.noClass); }
// 그날 반 cls 수업이 있나 → null(원래 없음) 또는 {label, hrs, on}
function classOn(key, d, cls){
  const slot = TIMETABLE[cls][effDow(key,d)];
  if(!slot) return null;
  const ov = store.chips[key+'_'+cls];
  const on = (ov !== undefined) ? ov : !isNoClass(key);
  return {label:slot[0], hrs:slot[1], on:on};
}

/* ═══════════ ④ 렌더링 ═══════════ */
const MONTH_LABEL = {8:'8월', 9:'9월', 10:'10월', 11:'11월', 12:'12월'};
function build(){
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  let monday = s2d(START), wno = 1, shownMonth = 0;
  while(d2s(monday) <= END){
    const mKey = d2s(monday);
    // 그 주에 새 달이 시작되면 달 구분 행
    for(let i=0;i<5;i++){
      const d = new Date(monday); d.setDate(d.getDate()+i);
      if(d2s(d) > END) break;
      if(d.getMonth()+1 !== shownMonth && d.getDate() <= 7 || (shownMonth===0)){
        if(d.getMonth()+1 !== shownMonth){
          shownMonth = d.getMonth()+1;
          const mr = document.createElement('tr'); mr.className='month-row';
          mr.innerHTML = '<td colspan="7">'+MONTH_LABEL[shownMonth]+'</td>';
          tbody.appendChild(mr);
        }
        break;
      }
    }
    const tr = document.createElement('tr');
    // 주차 칸
    const fri = new Date(monday); fri.setDate(fri.getDate()+4);
    const tdw = document.createElement('td'); tdw.className='wk';
    tdw.innerHTML = '<div class="wno">'+wno+'주</div><div class="wrange">'
      +(monday.getMonth()+1)+'/'+monday.getDate()+'~'+(fri.getMonth()+1)+'/'+fri.getDate()+'</div>'
      +'<div class="whrs" id="wh_'+mKey+'"></div>';
    tr.appendChild(tdw);
    // 진도 칸
    tr.appendChild(makeEditTd('plan', mKey, store.weeks[mKey], WEEK_PLAN[mKey]||'', '주 진도 입력'));
    // 요일 칸
    for(let i=0;i<5;i++){
      const d = new Date(monday); d.setDate(d.getDate()+i);
      const key = d2s(d);
      if(key > END){ const e=document.createElement('td'); e.className='day off'; tr.appendChild(e); continue; }
      tr.appendChild(makeDayTd(key, d));
    }
    tbody.appendChild(tr);
    monday.setDate(monday.getDate()+7); wno++;
  }
  refreshHours();
}

function makeDayTd(key, d){
  const td = document.createElement('td'); td.className='day';
  const evs = dayEvents(key);
  if(isNoClass(key)) td.classList.add('off');
  let html = '<div class="daytop"><span class="dnum">'+(d.getMonth()+1)+'/'+d.getDate()+'</span>';
  evs.forEach(e=>{ html += '<span class="bdg '+e.t+'">'+e.l+'</span>'; });
  html += '</div><div class="chips">';
  CLASS_ORDER.forEach(cls=>{
    const c = classOn(key, d, cls);
    if(c) html += '<span class="chip '+cls+(c.on?'':' offchip')+'" data-key="'+key+'" data-cls="'+cls+'">'
      +cls+' '+c.label+'</span>';
  });
  html += '</div>';
  td.innerHTML = html;
  td.querySelectorAll('.chip').forEach(ch=>{
    ch.addEventListener('click', ()=>toggleChip(ch.dataset.key, ch.dataset.cls));
  });
  td.appendChild(makeEditor('days', key, store.days[key], DAY_MEMO[key]||'', '메모'));
  const cur = (store.days[key] !== undefined) ? store.days[key] : null;
  if(cur !== null && cur !== (DAY_MEMO[key]||'')) markEdited(td, 'days', key);
  return td;
}

function makeEditTd(cssCls, key, saved, def, ph){
  const td = document.createElement('td'); td.className = cssCls;
  td.appendChild(makeEditor('weeks', key, saved, def, ph));
  if(saved !== undefined && saved !== def) markEdited(td, 'weeks', key);
  return td;
}

function makeEditor(kind, key, saved, def, ph){
  const div = document.createElement('div');
  div.className = 'ed'; div.contentEditable = 'true';
  div.dataset.ph = ph;
  div.innerText = (saved !== undefined) ? saved : def;
  div.addEventListener('input', ()=>{
    const val = div.innerText.replace(/\n$/,'');
    if(val === def){ delete store[kind][key]; unmarkEdited(div.parentElement); }
    else{ store[kind][key] = val; markEdited(div.parentElement, kind, key); }
    save();
  });
  return div;
}

function markEdited(td, kind, key){
  if(td.classList.contains('edited')) return;
  td.classList.add('edited');
  if(!td.querySelector('.rstbtn')){
    const b = document.createElement('button'); b.className='rstbtn'; b.textContent='↺ 기본값';
    b.title='이 칸을 기본 계획으로 되돌리기';
    b.addEventListener('click', ()=>{
      delete store[kind][key]; save(); build();
    });
    td.appendChild(b);
  }
}
function unmarkEdited(td){
  td.classList.remove('edited');
  const b = td.querySelector('.rstbtn'); if(b) b.remove();
}

function toggleChip(key, cls){
  const d = s2d(key);
  const cur = classOn(key, d, cls);
  const defOn = !isNoClass(key);
  const next = !cur.on;
  if(next === defOn) delete store.chips[key+'_'+cls];
  else store.chips[key+'_'+cls] = next;
  save(); build();
}

/* ═══════════ ⑤ 시수 집계 ═══════════ */
function refreshHours(){
  // 구간별 합계
  const term = {B:[0,0,0], C:[0,0,0], D:[0,0,0]};
  // 주별 합계
  const weekly = {};
  let d = s2d(START);
  while(d2s(d) <= END){
    const key = d2s(d);
    if(d.getDay()>=1 && d.getDay()<=5){
      const mon = new Date(d); mon.setDate(mon.getDate()-(mon.getDay()-1));
      const mKey = d2s(mon);
      if(!weekly[mKey]) weekly[mKey] = {B:0,C:0,D:0};
      CLASS_ORDER.forEach(cls=>{
        const c = classOn(key, d, cls);
        if(c && c.on){
          weekly[mKey][cls] += c.hrs;
          TERMS.forEach((t,i)=>{ if(key>=t.from && key<=t.to) term[cls][i]+=c.hrs; });
        }
      });
    }
    d.setDate(d.getDate()+1);
  }
  // 주차 칸에 표시
  Object.keys(weekly).forEach(mKey=>{
    const el = document.getElementById('wh_'+mKey);
    if(el) el.innerHTML = CLASS_ORDER.map(cls=>{
      const h = weekly[mKey][cls];
      return '<span class="h'+cls+(h===0?' h0':'')+'">'+cls+' '+h+'</span>';
    }).join('');
  });
  // 상단 요약
  document.getElementById('sumbox').innerHTML =
    CLASS_ORDER.map(cls=>'<span class="sumchip '+cls+'"><b>'+cls+'</b> '
      +term[cls][0]+' + '+term[cls][1]+' <span style="opacity:.6">+ '+term[cls][2]+'</span>h</span>').join('')
    +'<span class="sumnote">중간 전 + 중간~기말 <span style="opacity:.6">+ 기말 후</span></span>';
}

/* ═══════════ ⑥ 내보내기/가져오기/초기화 ═══════════ */
function doExport(){
  const blob = new Blob([JSON.stringify(store,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const now = new Date();
  a.download = '진도달력백업_'+now.getFullYear()+String(now.getMonth()+1).padStart(2,'0')+String(now.getDate()).padStart(2,'0')+'.json';
  a.click(); URL.revokeObjectURL(a.href);
}
function doImport(inp){
  const f = inp.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const obj = JSON.parse(r.result);
      if(typeof obj !== 'object' || !obj) throw 0;
      store = Object.assign({weeks:{},days:{},chips:{}}, obj);
      save(); build();
      alert('가져오기 완료 — 수정 칸이 복원되었습니다.');
    }catch(e){ alert('JSON 형식이 아닙니다.'); }
    inp.value = '';
  };
  r.readAsText(f);
}
function resetAll(){
  if(!confirm('모든 수정 내용을 지우고 기본 계획으로 되돌립니다.\n(내보내기로 백업하지 않은 수정은 사라집니다)\n계속할까요?')) return;
  store = {weeks:{}, days:{}, chips:{}};
  save(); build();
}

build();
</script>
</body>
